[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "r2morph"
version = "0.4.0-alpha.1"
description = "Metamorphic binary mutation engine with structural validation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
    {name = "Marc Rivero", email = "mriverolopez@gmail.com"}
]
maintainers = [
    {name = "Marc Rivero", email = "mriverolopez@gmail.com"}
]
keywords = [
    "binary-analysis",
    "metamorphic",
    "code-transformation",
    "radare2",
    "r2pipe",
    "reverse-engineering",
    "binary-mutation",
    "binary-patching",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "r2pipe>=1.9.0",
    "capstone>=5.0.0",
    "keystone-engine>=0.9.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.165.3",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-networkx>=3.0.0",
    "types-PyYAML>=6.0.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "pip>=26.1.2",
    "ipython>=8.12.0",
    "click>=8.3.3",
    "GitPython>=3.1.59",
    "idna>=3.15",
    "msgpack>=1.2.1",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "protobuf>=6.33.5",
    "unicorn>=2.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]
enhanced = [
    "angr>=9.3.2; platform_system != \"Windows\"",
    "z3-solver>=4.12.0",
    "frida>=16.0.0; platform_system != \"Windows\"",
    "frida-tools>=12.0.0; platform_system != \"Windows\"",
    "triton-library>=1.0.0rc4; platform_system == \"Linux\"",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
]
syntia = [
    "cvc5>=1.0.0",
    "pysmt>=0.9.0",
    "claripy>=9.3.2",
]
devirtualization = [
    "miasm>=0.1.0",
    "unicorn>=2.0.0",
]
machine-learning = [
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
all = [
    "angr>=9.3.2; platform_system != \"Windows\"",
    "z3-solver>=4.12.0",
    "frida>=16.0.0; platform_system != \"Windows\"",
    "frida-tools>=12.0.0; platform_system != \"Windows\"",
    "triton-library>=1.0.0rc4; platform_system == \"Linux\"",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
    "cvc5>=1.0.0",
    "pysmt>=0.9.0",
    "claripy>=9.3.2",
    "miasm>=0.1.0",
    "unicorn>=2.0.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[project.scripts]
r2morph = "r2morph.cli:app"

[project.urls]
Homepage = "https://github.com/seifreed/r2morph"
Documentation = "https://github.com/seifreed/r2morph#readme"
Repository = "https://github.com/seifreed/r2morph"
Issues = "https://github.com/seifreed/r2morph/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=r2morph",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "stable: marks tests for stable mutation passes (nop, substitute, register)",
    "experimental: marks tests for experimental mutation passes (expand, block, opaque, dead-code, cff)",
    "product_smoke: marks product acceptance tests for CI",
    "slow: marks tests that take longer than 10 seconds",
    "unit: marks unit tests",
    "integration: marks integration tests",
    "property: marks property-based (Hypothesis) tests",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["r2morph"]
branch = true
omit = [
]

[tool.coverage.report]
exclude_lines = []
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "I", "N", "UP", "SIM", "PL", "RUF"]
ignore = []

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "angr", "angr.*",
    "archinfo", "archinfo.*",
    "capstone", "capstone.*",
    "claripy", "claripy.*",
    "frida", "frida.*",
    "keystone", "keystone.*",
    "lief", "lief.*",
    "miasm", "miasm.*",
    "psutil", "psutil.*",
    "r2pipe", "r2pipe.*",
    "unicorn", "unicorn.*",
    "z3", "z3.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = []
severity = "LOW"
confidence = "LOW"

[tool.setuptools.packages.find]
where = ["."]
include = ["r2morph*"]
exclude = ["tests*", "docs*", "examples*", "scripts*"]
