---
name: Release Recovery

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag
        required: true
        type: string
      source_run_id:
        description: Release run containing validated distribution artifacts
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

jobs:
  recover-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate source run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          run_json=$(gh run view "$SOURCE_RUN_ID" --json headSha,jobs)
          tag_sha=$(git rev-parse "${RELEASE_TAG}^{commit}")
          test "$(jq -r '.headSha' <<< "$run_json")" = "$tag_sha"
          jobs_valid=$(jq -r '[.jobs[] | select(.name == "validate-release" or .name == "build" or .name == "test" or .name == "publish-pypi")] | length == 4 and all(.conclusion == "success")' <<< "$run_json")
          test "$jobs_valid" = "true"

      - name: Download validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: gh run download "$SOURCE_RUN_ID" --name dist --dir dist

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.whl sbom.cdx.json > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json

      - name: Generate changelog
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_version=${RELEASE_TAG#v}
          awk -v version="$release_version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changes.md
          test -s /tmp/changes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: dist/*
          body_path: /tmp/changes.md
          draft: false
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          generate_release_notes: true
