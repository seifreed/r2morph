name: Differential Corpus By Pass

"on":
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  differential-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run full differential corpus
        run: |
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes all \
            --first-seed 20260901 \
            --count 1 \
            --output differential-corpus.json

      - name: Upload per-pass differential report
        uses: actions/upload-artifact@v4
        with:
          name: differential-corpus-by-pass
          path: differential-corpus.json
