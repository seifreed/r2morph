name: Differential Corpus By Pass

"on":
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  differential-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run full differential corpus
        run: |
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes all \
            --require-applied \
            --require-complete-evidence \
            --generated-inputs \
            --generated-corpus \
            --first-seed 20260901 \
            --count 3 \
            --output differential-corpus.json

      - name: Validate differential campaign summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("differential-corpus.json").read_text(encoding="utf-8"))
          summary = report["campaign_summary"]
          if summary["platform_scope"] != {"os": "linux", "format": "ELF", "architecture": "x86-64"}:
              raise SystemExit(f"unexpected platform scope: {summary['platform_scope']}")
          if summary["platform_gap_scope"] != {"formats": ["Mach-O", "PE"], "architectures": ["AArch64", "ARM", "x86"]}:
              raise SystemExit(f"unexpected platform gap scope: {summary['platform_gap_scope']}")
          if summary["input_sources"] != ["default-argv", "generated-argv"]:
              raise SystemExit(f"unexpected input sources: {summary['input_sources']}")
          if summary["corpus_families"] != ["repository-fixtures", "generated-elf-x86-64"]:
              raise SystemExit(f"unexpected corpus families: {summary['corpus_families']}")
          if summary["generated_fixture_count"] != 3:
              raise SystemExit(f"unexpected generated fixture count: {summary['generated_fixture_count']}")
          if summary["corpus_gap_scope"] != {"corpus_families": [], "input_sources": []}:
              raise SystemExit(f"unexpected corpus gap scope: {summary['corpus_gap_scope']}")
          if summary["corpus_scope"] != {"dataset": "fixtures/dataset"}:
              raise SystemExit(f"unexpected corpus scope: {summary['corpus_scope']}")
          if summary["missing_corpus_passes"]:
              raise SystemExit(f"missing corpus passes: {summary['missing_corpus_passes']}")
          if summary["total_complete_evidence_missing_runs"] != 0:
              raise SystemExit("differential report has incomplete evidence")
          if summary["passes_with_incomplete_coverage"]:
              raise SystemExit(f"incomplete coverage: {summary['passes_with_incomplete_coverage']}")
          allowed = {
              "platform_gap_scope": summary["platform_gap_scope"],
              "corpus_gap_scope": summary["corpus_gap_scope"],
          }
          unexpected = {
              key: value
              for key, value in summary["continuous_evidence_blockers"].items()
              if key not in allowed or value != allowed[key]
          }
          if unexpected:
              raise SystemExit(f"unexpected continuous evidence blockers: {unexpected}")
          PY

      - name: Run extended maturity pass smoke
        env:
          EXTENDED_MATURITY_PASSES: >-
            AntiDisassembly,APIHashing,CodeMobility,DataFlowMutation,
            FunctionOutlining,ImportObfuscation,OpaquePredicates,
            PolymorphicEngine,SelfModifyingCode,ShortJumpPatching,
            StackStrings,StringObfuscation
        run: |
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes "$EXTENDED_MATURITY_PASSES" \
            --first-seed 20260901 \
            --count 1 \
            --output extended-maturity-passes.json

      - name: Validate extended maturity pass smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              "AntiDisassembly",
              "APIHashing",
              "CodeMobility",
              "DataFlowMutation",
              "FunctionOutlining",
              "ImportObfuscation",
              "OpaquePredicates",
              "PolymorphicEngine",
              "SelfModifyingCode",
              "ShortJumpPatching",
              "StackStrings",
              "StringObfuscation",
          ]
          report = json.loads(Path("extended-maturity-passes.json").read_text(encoding="utf-8"))
          if report["pass_names"] != expected:
              raise SystemExit(f"unexpected extended pass names: {report['pass_names']}")
          if report["campaign_summary"]["pass_count"] != len(expected):
              raise SystemExit(f"unexpected extended pass count: {report['campaign_summary']['pass_count']}")
          if report["campaign_summary"]["missing_extended_passes"]:
              raise SystemExit(f"missing extended pass rows: {report['campaign_summary']['missing_extended_passes']}")
          if set(report["summary"]) != set(expected):
              raise SystemExit("extended maturity summary is missing pass rows")
          if "passes_without_extended_applied_runs" not in report["campaign_summary"]:
              raise SystemExit("extended maturity summary is missing passes_without_extended_applied_runs")
          if "extended_maturity_evidence_blockers" not in report["campaign_summary"]:
              raise SystemExit("extended maturity summary is missing extended_maturity_evidence_blockers")
          if "total_extended_maturity_evidence_blockers" not in report["campaign_summary"][
              "extended_maturity_evidence_blocker_totals"
          ]:
              raise SystemExit("extended maturity blocker totals are missing total_extended_maturity_evidence_blockers")
          if report["campaign_summary"]["extended_passes_with_error_runs"]:
              raise SystemExit(
                  f"extended maturity pass errors: {report['campaign_summary']['extended_passes_with_error_runs']}"
              )
          PY

      - name: Upload per-pass differential report
        uses: actions/upload-artifact@v7
        with:
          name: differential-corpus-by-pass
          path: differential-corpus.json

      - name: Upload extended maturity pass smoke
        uses: actions/upload-artifact@v7
        with:
          name: extended-maturity-passes
          path: extended-maturity-passes.json
