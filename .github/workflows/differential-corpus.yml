name: Differential Corpus By Pass

concurrency:
  group: differential-corpus-${{ github.ref }}
  cancel-in-progress: true

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/differential-corpus.yml"
      - ".github/workflows/ci.yml"
      - "docs/compatibility-corpus.md"
      - "docs/support-matrix.json"
      - "fixtures/dataset/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "r2morph/**"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  differential-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fixture_shard: [0, 1, 2, 3]
        seed: [20260901, 20260902, 20260903]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Build and install package wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Run full differential corpus
        env:
          REPORT_NAME: differential-corpus-${{ matrix.fixture_shard }}-${{ matrix.seed }}.json
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R scripts tests fixtures pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes all \
            --require-applied \
            --require-complete-evidence \
            --generated-inputs \
            --generated-corpus \
            --first-seed "${{ matrix.seed }}" \
            --count 1 \
            --fixture-shard-index "${{ matrix.fixture_shard }}" \
            --fixture-shard-count 4 \
            --output "$GITHUB_WORKSPACE/differential-corpus.json"
          mv "$GITHUB_WORKSPACE/differential-corpus.json" "$GITHUB_WORKSPACE/$REPORT_NAME"

      - name: Validate differential campaign summary
        env:
          REPORT_NAME: differential-corpus-${{ matrix.fixture_shard }}-${{ matrix.seed }}.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_NAME"]).read_text(encoding="utf-8"))
          summary = report["campaign_summary"]
          if summary["platform_scope"] != {"os": "linux", "format": "ELF", "architecture": "x86-64"}:
              raise SystemExit(f"unexpected platform scope: {summary['platform_scope']}")
          if summary["platform_gap_scope"] != {"formats": ["Mach-O", "PE"], "architectures": ["AArch64", "ARM", "x86"]}:
              raise SystemExit(f"unexpected platform gap scope: {summary['platform_gap_scope']}")
          if summary["input_sources"] != ["default-argv", "generated-argv"]:
              raise SystemExit(f"unexpected input sources: {summary['input_sources']}")
          if summary["corpus_families"] != ["repository-fixtures", "generated-elf-x86-64"]:
              raise SystemExit(f"unexpected corpus families: {summary['corpus_families']}")
          if not 0 < summary["generated_fixture_count"] <= 136:
              raise SystemExit(f"unexpected generated fixture count: {summary['generated_fixture_count']}")
          expected_generated = sorted(
              f"{source}_{profile}"
              for source in ("generated_abi", "generated_branch", "generated_calls", "generated_extended", "generated_lookup", "generated_memory", "generated_pointers", "generated_recursive", "generated_stack_strings", "generated_string", "generated_xlat")
              for profile in ("gcc-o0", "gcc-o1", "gcc-o2", "gcc-o3", "gcc-os", "gcc-pie-o2", "gcc-static-o2", "gcc-stripped-o2", "clang-o0", "clang-o2", "clang-o3", "clang-pie-o2")
          )
          expected_generated += ["generated_cpp_gxx-o0", "generated_cpp_gxx-o2", "generated_cpp_clangxx-o0", "generated_cpp_clangxx-o2"]
          expected_generated.sort()
          if not set(summary["generated_fixture_names"]).issubset(expected_generated):
              raise SystemExit(f"unexpected generated fixture names: {summary['generated_fixture_names']}")
          if summary["corpus_gap_scope"] != {"corpus_families": [], "input_sources": []}:
              raise SystemExit(f"unexpected corpus gap scope: {summary['corpus_gap_scope']}")
          if summary["corpus_scope"] != {
              "dataset": "fixtures/dataset",
              "fixture_shard": {
                  "index": int(os.environ["REPORT_NAME"].split("-")[2]),
                  "count": 4,
              },
          }:
              raise SystemExit(f"unexpected corpus scope: {summary['corpus_scope']}")
          if summary["missing_corpus_passes"]:
              raise SystemExit(f"missing corpus passes: {summary['missing_corpus_passes']}")
          if "fixture_shard" not in summary["corpus_scope"] and summary["total_complete_evidence_missing_runs"] != 0:
              raise SystemExit("differential report has incomplete evidence")
          if "fixture_shard" not in summary["corpus_scope"] and summary["passes_with_incomplete_coverage"]:
              raise SystemExit(f"incomplete coverage: {summary['passes_with_incomplete_coverage']}")
          allowed = {
              "platform_gap_scope": summary["platform_gap_scope"],
              "corpus_gap_scope": summary["corpus_gap_scope"],
          }
          if "fixture_shard" in summary["corpus_scope"]:
              allowed["passes_without_applied_runs"] = summary["passes_without_applied_runs"]
              allowed["metric_missing_runs"] = summary["metric_missing_runs"]
              allowed["passes_with_incomplete_coverage"] = summary["passes_with_incomplete_coverage"]
          unexpected = {
              key: value
              for key, value in summary["continuous_evidence_blockers"].items()
              if key not in allowed or value != allowed[key]
          }
          if unexpected:
              reasons = summary.get("runtime_observable_failure_reasons_by_pass", {})
              raise SystemExit(
                  "unexpected continuous evidence blockers: "
                  f"{unexpected}; runtime failure reasons by pass: {reasons}"
              )
          PY

      - name: Run cross-format differential smoke
        if: always()
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/cross-format-differential.xml" \
            tests/integration/test_binary_rewriter_formats_real.py \
            tests/integration/test_platform_deeper.py \
            tests/integration/test_mutation_passes_end_to_end_more2.py \
            tests/integration/test_mutation_nop_insertion_arm64.py \
            tests/integration/test_code_virtualization_target_support_real.py

      - name: Validate cross-format differential evidence
        if: always() && hashFiles('cross-format-differential.xml') != ''
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("cross-format-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 10:
              raise SystemExit(f"cross-format smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("cross-format smoke contains failures or errors")
          unexpected_skips = [
              node.text or ""
              for node in suite.findall(".//skipped")
              if "Mach-O arm64 execution requires macOS" not in (node.text or "")
          ]
          if unexpected_skips:
              raise SystemExit(f"cross-format smoke contains unexpected skips: {unexpected_skips}")
          names = {case.attrib.get("name", "") for case in cases}
          required = {
              "test_binary_rewriter_analyze_binary_formats",
              "test_binary_rewriter_rewrite_no_patches",
              "test_binary_rewriter_noop_preserves_real_format",
              "test_elf_handler_symbols_and_preserve",
              "test_pe_handler_checksum",
              "test_macho_handler_repair_and_codesign",
              "test_multiple_mutation_passes_on_x86_binary",
              "test_instruction_substitution_pe_x86_64_preserves_real_integrity",
              "test_nop_insertion_arm64_path",
              "test_nop_insertion_arm64_does_not_record_encoding_identical_rewrites",
              "test_instruction_substitution_arm64_changes_real_instruction_encoding",
              "test_code_virtualization_pe_x86_64_target_is_rejected_before_mutation",
              "test_code_virtualization_macho_arm64_target_is_rejected_before_mutation",
            }
          if not all(any(name.startswith(prefix) for name in names) for prefix in required):
              raise SystemExit(f"cross-format smoke coverage drift: {sorted(names)}")
          Path("cross-format-differential.xml").stat()
          PY

      - name: Run composition regression smoke
        if: always()
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/composition-differential.xml" \
            tests/integration/test_polymorphic_engine_real.py

      - name: Validate composition differential evidence
        if: always() && hashFiles('composition-differential.xml') != ''
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("composition-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 38:
              raise SystemExit(f"composition smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("composition smoke contains failures or errors")
          if len(cases) != 39:
              raise SystemExit(f"composition smoke case count drifted: {len(cases)}")
          names = {case.attrib.get("name", "") for case in cases}
          required = {
              "test_polymorphic_engine_reports_composed_mutations_and_preserves_exit_code",
              "test_composed_real_passes_preserve_exit_code[nop_then_substitution]",
              "test_composed_real_passes_preserve_exit_code[constant_then_substitution]",
              "test_composed_real_passes_preserve_exit_code[nop_then_constant]",
              "test_composed_real_passes_preserve_exit_code[constant_then_nop]",
              "test_composed_real_passes_preserve_exit_code[substitution_then_nop]",
              "test_composed_real_passes_preserve_exit_code[substitution_then_constant]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[BlockReordering]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[CodeVirtualization]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[ControlFlowFlattening]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[DeadCodeInjection]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[InstructionExpansion]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[PatternSubstitution]",
              "test_core_passes_compose_with_nop_and_preserve_exit_code[RegisterSubstitution]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[AntiDisassembly]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[APIHashing]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[CodeMobility]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[DataFlowMutation]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[FunctionOutlining]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[ImportObfuscation]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[OpaquePredicates]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[PolymorphicEngine]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[SelfModifyingCode]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[ShortJumpPatching]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[StackStrings]",
              "test_extended_passes_compose_after_nop_without_corrupting_fixture[StringObfuscation]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[AntiDisassembly]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[APIHashing]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[CodeMobility]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[DataFlowMutation]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[FunctionOutlining]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[ImportObfuscation]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[OpaquePredicates]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[PolymorphicEngine]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[SelfModifyingCode]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[ShortJumpPatching]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[StackStrings]",
              "test_extended_passes_compose_before_nop_without_corrupting_fixture[StringObfuscation]",
          }
          if not required.issubset(names):
              raise SystemExit(f"composition smoke coverage drift: {sorted(names)}")
          directional_pairs = {
              "NopInsertion->InstructionSubstitution",
              "InstructionSubstitution->NopInsertion",
              "NopInsertion->ConstantUnfolding",
              "ConstantUnfolding->NopInsertion",
              "ConstantUnfolding->InstructionSubstitution",
              "InstructionSubstitution->ConstantUnfolding",
          }
          for name in required:
              if "after_nop" in name:
                  parameter = name.rsplit("[", 1)[-1].rstrip("]")
                  directional_pairs.add(f"NopInsertion->{parameter}")
              elif "before_nop" in name:
                  parameter = name.rsplit("[", 1)[-1].rstrip("]")
                  directional_pairs.add(f"{parameter}->NopInsertion")
          if len(directional_pairs) != 30:
              raise SystemExit(f"composition directional matrix drift: {sorted(directional_pairs)}")
          Path("composition-differential.xml").stat()
          PY

      - name: Run VM semantic regression smoke
        if: always()
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/vm-semantic-differential.xml" \
            tests/integration/test_code_virtualization_memory_widths_real.py::test_memory_width_fixture_virtualization_preserves_exit_code \
            tests/integration/test_code_virtualization_call_callee_saved_real.py::test_virtualized_callee_saved_fixture_preserves_registers \
            tests/integration/test_code_virtualization_call_flags_stack_real.py::test_call_flags_stack_fixture_virtualization_preserves_exit_code \
            tests/integration/test_code_virtualization_tls_real.py::test_virtualized_elf_preserves_fs_relative_access \
            tests/integration/test_code_virtualization_threads_signals_real.py::test_virtualized_threads_tls_and_signal_preserve_exit_code \
            tests/integration/test_code_virtualization_call_abi_real.py::test_virtualized_elf_preserves_integer_varargs_stack_abi \
            tests/integration/test_code_virtualization_call_abi_real.py::test_virtualized_elf_preserves_floating_point_varargs_register_and_stack_abi \
            tests/integration/test_code_virtualization_internal_icall_real.py::test_virtualized_direct_call_to_separate_function_preserves_exit_code \
            tests/integration/test_code_virtualization_internal_icall_real.py \
            tests/integration/test_code_virtualization_fp_vex_nondestructive_real.py::test_virtualized_vex_nondestructive_packed_add_preserves_result \
            tests/integration/test_code_virtualization_simd_integer_real.py::test_simd_integer_fixture_virtualization_preserves_exit_code \
            tests/integration/test_code_virtualization_exception_gate_real.py \
            tests/integration/test_code_virtualization_generic_isa_real.py \
            tests/unit/test_code_virtualization_static_dataflow.py \
            tests/integration/test_code_virtualization_memory_widths_real.py \
            tests/integration/test_code_virtualization_tls_widths_real.py \
            tests/integration/test_code_virtualization_call_abi_real.py \
            tests/integration/test_code_virtualization_fp_compare_memory_real.py \
            tests/integration/test_code_virtualization_simd_move_real.py \
            tests/integration/test_code_virtualization_threads_signals_real.py \
            tests/integration/test_code_virtualization_xlat_real.py

      - name: Validate VM semantic differential evidence
        if: always() && hashFiles('vm-semantic-differential.xml') != ''
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("vm-semantic-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 56:
              raise SystemExit(f"VM semantic smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error") or suite.findall(".//skipped"):
              raise SystemExit("VM semantic smoke contains failures, errors, or skipped cases")
          names = "\n".join(case.attrib.get("name", "") for case in cases)
          required = (
              "test_memory_width_fixture_virtualization_preserves_exit_code",
              "test_virtualized_xlatb_preserves_native_lookup_result",
              "test_virtualized_callee_saved_fixture_preserves_registers",
              "test_virtualized_elf_preserves_fs_relative_access",
              "test_virtualized_threads_tls_and_signal_preserve_exit_code",
              "test_virtualized_elf_preserves_integer_varargs_stack_abi",
              "test_virtualized_elf_preserves_floating_point_varargs_register_and_stack_abi",
              "test_virtualized_direct_call_to_separate_function_preserves_exit_code",
              "test_virtualized_local_indirect_call_preserves_exit_code",
              "test_virtualized_memory_indirect_call_preserves_external_result",
              "test_virtualized_memory_indirect_call_with_stack_arguments_preserves_exit_code",
              "test_virtualized_vex_nondestructive_packed_add_preserves_result",
              "test_simd_integer_fixture_virtualization_preserves_exit_code",
              "test_code_virtualization_preserves_exception_from_call_inside_virtualized_function",
              "test_code_virtualization_propagates_exception_through_virtualized_native_call",
              "test_static_dataflow",
              "test_virtualized_byte_word_memory_arithmetic_preserves_result",
              "test_virtualized_no_base_indexed_memory_arithmetic_preserves_result",
              "test_tls_byte_and_word_virtualization_preserves_exit_code",
              "test_virtualized_elf_preserves_vector_call_abi",
              "test_virtualized_elf_preserves_incoming_stack_argument",
              "test_fpcmp_memory_fixture_virtualization_preserves_exit_code",
              "test_simd_move_fixture_virtualization_preserves_both_qwords",
              "test_virtualized_async_signal_inside_vm_preserves_exit_code",
          )
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"VM semantic smoke coverage drift: {missing}")
          Path("vm-semantic-differential.xml").stat()
          PY

      - name: Run parser and rewriter fuzz smoke
        if: always()
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python scripts/continuous_fuzz.py \
            --cases 64 \
            --seed 20260827 \
            --max-payload 512 \
            --output "$GITHUB_WORKSPACE/differential-fuzz-smoke.json"

      - name: Validate parser and rewriter fuzz smoke
        if: always() && hashFiles('differential-fuzz-smoke.json') != ''
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = json.loads(Path("differential-fuzz-smoke.json").read_text(encoding="utf-8"))
          expected_targets = {
              "binary_parsers": 64,
              "vm_dispatcher": 64,
              "relocations": 64,
              "binary_rewriter": 64,
          }
          if report["failure_count"] != 0:
              raise SystemExit(f"fuzz smoke failures: {report['failures']}")
          if report["target_runs"] != expected_targets:
              raise SystemExit(f"unexpected fuzz target runs: {report['target_runs']}")
          PY

      - name: Run extended maturity pass smoke
        if: always()
        env:
          EXTENDED_MATURITY_PASSES: >-
            AntiDisassembly,APIHashing,CodeMobility,DataFlowMutation,
            FunctionOutlining,ImportObfuscation,OpaquePredicates,
            PolymorphicEngine,SelfModifyingCode,ShortJumpPatching,
            StackStrings,StringObfuscation
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes "$EXTENDED_MATURITY_PASSES" \
            --first-seed "${{ matrix.seed }}" \
            --count 1 \
            --generated-inputs \
            --generated-corpus \
            --fixture-shard-index "${{ matrix.fixture_shard }}" \
            --fixture-shard-count 4 \
            --output "$GITHUB_WORKSPACE/extended-maturity-passes.json"

      - name: Validate extended maturity pass smoke
        if: always() && hashFiles('extended-maturity-passes.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              "AntiDisassembly",
              "APIHashing",
              "CodeMobility",
              "DataFlowMutation",
              "FunctionOutlining",
              "ImportObfuscation",
              "OpaquePredicates",
              "PolymorphicEngine",
              "SelfModifyingCode",
              "ShortJumpPatching",
              "StackStrings",
              "StringObfuscation",
          ]
          report = json.loads(Path("extended-maturity-passes.json").read_text(encoding="utf-8"))
          if report["pass_names"] != expected:
              raise SystemExit(f"unexpected extended pass names: {report['pass_names']}")
          if report["campaign_summary"]["pass_count"] != len(expected):
              raise SystemExit(f"unexpected extended pass count: {report['campaign_summary']['pass_count']}")
          if report["campaign_summary"]["missing_extended_passes"]:
              raise SystemExit(f"missing extended pass rows: {report['campaign_summary']['missing_extended_passes']}")
          if set(report["summary"]) != set(expected):
              raise SystemExit("extended maturity summary is missing pass rows")
          if "passes_without_extended_applied_runs" not in report["campaign_summary"]:
              raise SystemExit("extended maturity summary is missing passes_without_extended_applied_runs")
          if "extended_maturity_evidence_blockers" not in report["campaign_summary"]:
              raise SystemExit("extended maturity summary is missing extended_maturity_evidence_blockers")
          if "total_extended_maturity_evidence_blockers" not in report["campaign_summary"][
              "extended_maturity_evidence_blocker_totals"
          ]:
              raise SystemExit("extended maturity blocker totals are missing total_extended_maturity_evidence_blockers")
          if report["campaign_summary"]["extended_passes_with_error_runs"]:
              raise SystemExit(
                  f"extended maturity pass errors: {report['campaign_summary']['extended_passes_with_error_runs']}"
              )
          if report["campaign_summary"]["passes_with_behavioral_false_positives"]:
              raise SystemExit(
                  "behavioral false positives: "
                  f"{report['campaign_summary']['passes_with_behavioral_false_positives']}"
              )
          if report["campaign_summary"]["passes_with_independent_semantic_false_positives"]:
              raise SystemExit(
                  "independent semantic false positives: "
                  f"{report['campaign_summary']['passes_with_independent_semantic_false_positives']}"
              )
          if report["campaign_summary"]["behavioral_validation_missing_observations_by_pass"]:
              raise SystemExit(
                  "missing behavioral validation observations: "
                  f"{report['campaign_summary']['behavioral_validation_missing_observations_by_pass']}"
              )
          if report["campaign_summary"]["passes_with_missing_affected_instruction_evidence"]:
              raise SystemExit(
                  "missing affected-instruction evidence: "
                  f"{report['campaign_summary']['passes_with_missing_affected_instruction_evidence']}"
              )
          if any(
              value != 0
              for value in report["campaign_summary"]["behavioral_false_positive_rate_percent_by_pass"].values()
          ):
              raise SystemExit("extended maturity false-positive rate is non-zero")
          if any(
              value != 0
              for value in report["campaign_summary"][
                  "independent_semantic_false_positive_rate_percent_by_pass"
              ].values()
          ):
              raise SystemExit("extended maturity independent semantic false-positive rate is non-zero")
          if report["campaign_summary"]["independent_semantic_missing_observations_by_pass"]:
              raise SystemExit(
                  "extended maturity independent semantic observations are incomplete: "
                  f"{report['campaign_summary']['independent_semantic_missing_observations_by_pass']}"
              )
          required_metrics = {"output_size", "runtime_duration", "static_metric", "transform_duration"}
          missing_metrics = {
              name: count
              for name, count in report["campaign_summary"]["metric_missing_runs"].items()
              if name in required_metrics and count != 0
          }
          if missing_metrics:
              raise SystemExit(f"extended maturity performance metrics are incomplete: {missing_metrics}")
          incomplete_metrics = {
              name: passes
              for name, passes in report["campaign_summary"]["passes_with_incomplete_coverage"].items()
              if name in required_metrics and passes
          }
          if incomplete_metrics:
              raise SystemExit(f"extended maturity performance coverage is incomplete: {incomplete_metrics}")
          PY

      - name: Upload per-pass differential report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: differential-corpus-by-pass-${{ matrix.fixture_shard }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: differential-corpus-${{ matrix.fixture_shard }}-${{ matrix.seed }}.json

      - name: Upload cross-format differential evidence
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('cross-format-differential.xml') != ''
        with:
          name: cross-format-differential-${{ matrix.fixture_shard }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-format-differential.xml

      - name: Upload VM semantic differential evidence
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('vm-semantic-differential.xml') != ''
        with:
          name: vm-semantic-differential-${{ matrix.fixture_shard }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: vm-semantic-differential.xml

      - name: Upload composition differential evidence
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('composition-differential.xml') != ''
        with:
          name: composition-differential-${{ matrix.fixture_shard }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: composition-differential.xml

      - name: Upload extended maturity pass smoke
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('extended-maturity-passes.json') != ''
        with:
          name: extended-maturity-passes-${{ matrix.fixture_shard }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: extended-maturity-passes.json

      - name: Upload differential fuzz smoke
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('differential-fuzz-smoke.json') != ''
        with:
          name: differential-fuzz-smoke-${{ matrix.fixture_shard }}-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: differential-fuzz-smoke.json

  vm-semantic-campaign:
    name: VM semantic native parity campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run VM semantic native parity campaign
        run: |
          python scripts/vm_semantic_campaign.py \
            --dataset fixtures/dataset \
            --coverage docs/virtualization-coverage.json \
            --seed 20260916 \
            --seed 20260917 \
            --seed 20260918 \
            --output vm-semantic-campaign.json

      - name: Validate VM semantic campaign
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("vm-semantic-campaign.json").read_text(encoding="utf-8"))
          if report["status"] != "passed" or report["seed_count"] != 3 or report["fixture_count"] != 453:
              raise SystemExit(f"VM semantic campaign incomplete: {report}")
          if report["failed_count"] != 0 or report["passed_count"] != 453:
              raise SystemExit(f"VM semantic campaign has failures: {report}")
          fixture_results = report.get("fixture_results", [])
          if len(fixture_results) != 453:
              raise SystemExit(f"VM semantic fixture detail coverage is incomplete: {len(fixture_results)}")
          if any(
              row.get("status") != "passed"
              or not isinstance(row.get("functions_virtualized"), int)
              or row["functions_virtualized"] < 1
              or row.get("unsupported_functions") != 0
              or row.get("observables_equal") is not True
              or not isinstance(row.get("original"), dict)
              or not isinstance(row.get("mutated"), dict)
              or "termination_signal" not in row["original"]
              or "termination_signal" not in row["mutated"]
              or not isinstance(row["original"].get("created_files"), dict)
              or not isinstance(row["mutated"].get("created_files"), dict)
              for row in fixture_results
          ):
              raise SystemExit("VM semantic fixture detail contains incomplete observable evidence")
          categories = report["category_summary"]
          if len(categories) != 12:
              raise SystemExit(f"VM semantic campaign category coverage is incomplete: {categories}")
          for category, summary in categories.items():
              if (
                  summary["fixture_count"] == 0
                  or summary["passed_count"] != summary["fixture_count"]
                  or summary["failed_count"] != 0
              ):
                  raise SystemExit(f"VM semantic campaign category failed: {category}: {summary}")
          expected_capabilities = {
              "memory",
              "direct-calls",
              "indirect-calls",
              "abi-varargs",
              "unwinding-exceptions",
              "tls-signals",
              "threads",
              "fp-simd",
              "ssa-liveness",
          }
          capabilities = report.get("capability_summary", {})
          if set(capabilities) != expected_capabilities:
              raise SystemExit(f"VM semantic capability coverage drift: {capabilities}")
          measured = {
              name for name, summary in capabilities.items() if summary["status"] == "campaign-measured"
          }
          if measured != {
              "memory",
              "direct-calls",
              "indirect-calls",
              "abi-varargs",
              "unwinding-exceptions",
              "tls-signals",
              "threads",
              "fp-simd",
              "ssa-liveness",
          }:
              raise SystemExit(f"VM semantic capability evidence is incomplete: {capabilities}")
          PY

      - name: Upload VM semantic campaign evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-semantic-campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: vm-semantic-campaign.json

  aggregate-differential-corpus:
    name: Aggregate differential corpus evidence
    if: ${{ always() }}
    needs: differential-corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: differential-corpus-by-pass-*
          path: differential-reports
          merge-multiple: false

      - name: Download secondary evidence
        uses: actions/download-artifact@v8
        with:
          pattern: cross-format-differential-*
          path: cross-format-reports
          merge-multiple: false

      - name: Download VM semantic evidence
        uses: actions/download-artifact@v8
        with:
          pattern: vm-semantic-differential-*
          path: vm-semantic-reports
          merge-multiple: false

      - name: Download composition evidence
        uses: actions/download-artifact@v8
        with:
          pattern: composition-differential-*
          path: composition-reports
          merge-multiple: false

      - name: Download extended maturity evidence
        uses: actions/download-artifact@v8
        with:
          pattern: extended-maturity-passes-*
          path: extended-maturity-reports
          merge-multiple: false

      - name: Download fuzz evidence
        uses: actions/download-artifact@v8
        with:
          pattern: differential-fuzz-smoke-*
          path: fuzz-reports
          merge-multiple: false

      - name: Merge and validate campaign evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts.protection_maturity_baseline import merge_maturity_reports

          expected_shards = 12

          def require_files(pattern: str, expected: int) -> list[Path]:
              paths = sorted(Path(pattern.split("/*")[0]).glob("*/*"))
              if len(paths) != expected:
                  raise SystemExit(f"expected {expected} evidence files for {pattern}, found {len(paths)}")
              return paths

          def validate_junit_reports(
              pattern: str,
              minimum_cases: int,
              allow_skipped: bool = False,
              allowed_skip_text: str | None = None,
          ) -> list[Path]:
              import xml.etree.ElementTree as ET

              paths = require_files(pattern, expected_shards)
              for path in paths:
                  suite = ET.parse(path).getroot()
                  if len(suite.findall(".//testcase")) < minimum_cases:
                      raise SystemExit(f"evidence file has too few cases: {path}")
                  if suite.findall(".//failure") or suite.findall(".//error"):
                      raise SystemExit(f"evidence file has failures or errors: {path}")
                  skipped = suite.findall(".//skipped")
                  if not allow_skipped and skipped:
                      raise SystemExit(f"evidence file has skipped cases: {path}")
                  if allowed_skip_text is not None:
                      unexpected = [
                          node.text or ""
                          for node in skipped
                          if allowed_skip_text not in (node.text or "")
                      ]
                      if unexpected:
                          raise SystemExit(f"evidence file has unexpected skipped cases: {path}: {unexpected}")
              return paths

          validate_junit_reports(
              "cross-format-reports",
              10,
              allow_skipped=True,
              allowed_skip_text="Mach-O arm64 execution requires macOS",
          )
          vm_semantic_reports = validate_junit_reports("vm-semantic-reports", 56)
          validate_junit_reports("composition-reports", 39)

          required_vm_contracts = {
              "memory": (
                  "test_memory_width_fixture_virtualization_preserves_exit_code",
                  "test_virtualized_xlatb_preserves_native_lookup_result",
              ),
              "direct-calls": ("test_virtualized_direct_call_to_separate_function_preserves_exit_code",),
              "indirect-calls": (
                  "test_virtualized_local_indirect_call_preserves_exit_code",
                  "test_virtualized_memory_indirect_call_preserves_external_result",
              ),
              "abi-varargs": (
                  "test_virtualized_elf_preserves_integer_varargs_stack_abi",
                  "test_virtualized_elf_preserves_floating_point_varargs_register_and_stack_abi",
              ),
              "unwinding-exceptions": (
                  "test_code_virtualization_preserves_exception_from_call_inside_virtualized_function",
                  "test_code_virtualization_propagates_exception_through_virtualized_native_call",
              ),
              "tls-signals": (
                  "test_virtualized_elf_preserves_fs_relative_access",
                  "test_virtualized_async_signal_inside_vm_preserves_exit_code",
              ),
              "threads": ("test_virtualized_threads_tls_and_signal_preserve_exit_code",),
              "fp-simd": (
                  "test_virtualized_vex_nondestructive_packed_add_preserves_result",
                  "test_simd_integer_fixture_virtualization_preserves_exit_code",
                  "test_fpcmp_memory_fixture_virtualization_preserves_exit_code",
              ),
              "ssa-liveness": ("test_static_dataflow",),
          }
          capability_contracts = {
              capability: {"status": "regression-covered", "tests": list(test_names)}
              for capability, test_names in required_vm_contracts.items()
          }
          for report_path in vm_semantic_reports:
              names = {
                  case.attrib.get("name", "")
                  for case in ET.parse(report_path).getroot().findall(".//testcase")
              }
              missing = [
                  test_name
                  for test_names in required_vm_contracts.values()
                  for test_name in test_names
                  if not any(name.startswith(test_name) for name in names)
              ]
              if missing:
                  raise SystemExit(f"VM semantic regression contract drift in {report_path}: {missing}")
          Path("vm-semantic-contracts-merged.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "measurement": "vm-semantic-regression-contracts",
                      "shard_count": len(vm_semantic_reports),
                      "capabilities": capability_contracts,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          expected_fuzz_targets = {
              "binary_parsers": 64,
              "vm_dispatcher": 64,
              "relocations": 64,
              "binary_rewriter": 64,
          }
          for path in require_files("fuzz-reports", expected_shards):
              fuzz_report = json.loads(path.read_text(encoding="utf-8"))
              if fuzz_report["failure_count"] != 0 or fuzz_report["target_runs"] != expected_fuzz_targets:
                  raise SystemExit(f"fuzz evidence failed: {path}")

          expected_extended_passes = {
              "AntiDisassembly",
              "APIHashing",
              "CodeMobility",
              "DataFlowMutation",
              "FunctionOutlining",
              "ImportObfuscation",
              "OpaquePredicates",
              "PolymorphicEngine",
              "SelfModifyingCode",
              "ShortJumpPatching",
              "StackStrings",
              "StringObfuscation",
          }
          extended_reports = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in require_files("extended-maturity-reports", expected_shards)
          ]
          for maturity_report in extended_reports:
              if set(maturity_report["pass_names"]) != expected_extended_passes:
                  raise SystemExit("extended maturity pass coverage drift")
          merged_extended = merge_maturity_reports(extended_reports)
          maturity_summary = merged_extended["campaign_summary"]
          expected_unapplied_extended_passes = set()
          observed_unapplied_extended_passes = set(maturity_summary["passes_without_extended_applied_runs"])
          if observed_unapplied_extended_passes != expected_unapplied_extended_passes:
              raise SystemExit(
                  "unexpected extended maturity passes without applied evidence after all shards: "
                  f"{sorted(observed_unapplied_extended_passes)}"
              )
          if maturity_summary["extended_passes_with_error_runs"]:
              raise SystemExit(
                  f"extended maturity pass errors after all shards: {maturity_summary['extended_passes_with_error_runs']}"
              )
          if maturity_summary["passes_with_behavioral_false_positives"]:
              raise SystemExit(
                  "extended maturity false positives after all shards: "
                  f"{maturity_summary['passes_with_behavioral_false_positives']}"
              )
          if maturity_summary["passes_with_independent_semantic_false_positives"]:
              raise SystemExit(
                  "extended maturity independent semantic false positives after all shards: "
                  f"{maturity_summary['passes_with_independent_semantic_false_positives']}"
              )
          if maturity_summary["behavioral_validation_missing_observations_by_pass"]:
              raise SystemExit(
                  "extended maturity missing observations after all shards: "
                  f"{maturity_summary['behavioral_validation_missing_observations_by_pass']}"
              )
          if maturity_summary["passes_with_missing_affected_instruction_evidence"]:
              raise SystemExit(
                  "extended maturity affected-instruction evidence is incomplete after all shards: "
                  f"{maturity_summary['passes_with_missing_affected_instruction_evidence']}"
              )
          required_metrics = {"output_size", "runtime_duration", "static_metric", "transform_duration"}
          missing_metrics = {
              name: count
              for name, count in maturity_summary["metric_missing_runs"].items()
              if name in required_metrics and count != 0
          }
          if missing_metrics:
              raise SystemExit(f"extended maturity performance metrics are incomplete: {missing_metrics}")
          incomplete_metrics = {
              name: passes
              for name, passes in maturity_summary["passes_with_incomplete_coverage"].items()
              if name in required_metrics and passes
          }
          if incomplete_metrics:
              raise SystemExit(f"extended maturity performance coverage is incomplete: {incomplete_metrics}")
          Path("extended-maturity-merged.json").write_text(
              json.dumps(merged_extended, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          paths = sorted(Path("differential-reports").glob("*/differential-corpus-*.json"))
          if len(paths) != 12:
              raise SystemExit(f"expected 12 shard reports, found {len(paths)}")
          report = merge_maturity_reports(
              [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          )
          summary = report["campaign_summary"]
          expected_generated = sorted(
              f"{source}_{profile}"
              for source in ("generated_abi", "generated_branch", "generated_calls", "generated_extended", "generated_lookup", "generated_memory", "generated_pointers", "generated_recursive", "generated_stack_strings", "generated_string", "generated_xlat")
              for profile in ("gcc-o0", "gcc-o1", "gcc-o2", "gcc-o3", "gcc-os", "gcc-pie-o2", "gcc-static-o2", "gcc-stripped-o2", "clang-o0", "clang-o2", "clang-o3", "clang-pie-o2")
          )
          expected_generated += ["generated_cpp_gxx-o0", "generated_cpp_gxx-o2", "generated_cpp_clangxx-o0", "generated_cpp_clangxx-o2"]
          expected_generated.sort()
          if summary["generated_fixture_count"] != 136 or summary["generated_fixture_names"] != expected_generated:
              raise SystemExit("merged generated corpus coverage is incomplete")
          if summary["passes_without_applied_runs"]:
              raise SystemExit(
                  "passes without applied evidence after all shards: "
                  f"{summary['passes_without_applied_runs']}"
              )
          if summary["passes_with_error_runs"]:
              raise SystemExit(f"pass errors after all shards: {summary['passes_with_error_runs']}")
          if summary["passes_with_semantic_failures"]:
              raise SystemExit(f"semantic failures after all shards: {summary['passes_with_semantic_failures']}")
          if summary["passes_with_runtime_observable_failures"]:
              raise SystemExit(
                  "runtime observable failures after all shards: "
                  f"{summary['passes_with_runtime_observable_failures']}"
              )
          if summary["passes_with_behavioral_false_positives"]:
              raise SystemExit(
                  "behavioral false positives after all shards: "
                  f"{summary['passes_with_behavioral_false_positives']}"
              )
          if summary["passes_with_independent_semantic_false_positives"]:
              raise SystemExit(
                  "independent semantic false positives after all shards: "
                  f"{summary['passes_with_independent_semantic_false_positives']}"
              )
          if summary["behavioral_validation_missing_observations_by_pass"]:
              raise SystemExit(
                  "missing behavioral observations after all shards: "
                  f"{summary['behavioral_validation_missing_observations_by_pass']}"
              )
          if summary["independent_semantic_missing_observations_by_pass"]:
              raise SystemExit(
                  "missing independent semantic observations after all shards: "
                  f"{summary['independent_semantic_missing_observations_by_pass']}"
              )
          if any(
              value != 0
              for value in summary["independent_semantic_false_positive_rate_percent_by_pass"].values()
          ):
              raise SystemExit("independent semantic false-positive rate is non-zero")
          if summary["total_complete_evidence_missing_runs"] != 0:
              raise SystemExit("merged differential report has incomplete evidence")
          if summary["passes_with_incomplete_coverage"]:
              raise SystemExit(f"merged differential coverage is incomplete: {summary['passes_with_incomplete_coverage']}")
          Path("differential-corpus-merged.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build per-pass maturity evidence document
        run: |
          python scripts/maturity_evidence.py \
            --differential differential-corpus-merged.json \
            --extended extended-maturity-merged.json \
            --composition-dir composition-reports \
            --output maturity-evidence-merged.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("maturity-evidence-merged.json").read_text(encoding="utf-8"))
          expected = set(report["pass_names"])
          if set(report["passes"]) != expected:
              raise SystemExit("per-pass maturity evidence is missing pass rows")
          required_fields = {
              "performance",
              "behavioral_false_positive",
              "affected_instructions",
              "composition",
              "decompiler",
          }
          for pass_name, evidence in report["passes"].items():
              if set(evidence) != required_fields:
                  raise SystemExit(f"per-pass maturity evidence fields drift for {pass_name}")
          if report["summary"]["blocker_totals"]["performance"]:
              raise SystemExit("per-pass maturity evidence has incomplete performance rows")
          for field in ("behavioral_false_positive", "affected_instructions", "composition"):
              if report["summary"]["blocker_totals"][field]:
                  raise SystemExit(f"per-pass maturity evidence has incomplete {field} rows")
          if report["summary"]["blocker_totals"]["decompiler"] == 0:
              raise SystemExit("per-pass maturity evidence lost the explicit decompiler evidence state")
          PY

      - name: Upload merged differential evidence
        uses: actions/upload-artifact@v7
        with:
          name: differential-corpus-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            differential-corpus-merged.json
            extended-maturity-merged.json
            maturity-evidence-merged.json
            vm-semantic-contracts-merged.json

  cross-platform-differential:
    name: Cross-platform differential (macOS ARM64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install radare2
        run: |
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Run native cross-platform differential smoke
        run: |
          wheel_root=/tmp/r2morph-cross-platform-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R tests fixtures scripts pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/cross-platform-differential.xml" \
            tests/integration/test_binary_rewriter_formats_real.py \
            tests/integration/test_platform_deeper.py \
            tests/integration/test_mutation_nop_insertion_arm64.py \
            tests/integration/test_mutation_register_substitution_arm64.py \
            tests/integration/test_mutation_passes_end_to_end_more2.py \
            tests/integration/test_code_virtualization_target_support_real.py

      - name: Validate native cross-platform differential evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("cross-platform-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 20:
              raise SystemExit(f"cross-platform smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("cross-platform smoke contains failures or errors")
          if suite.findall(".//skipped"):
              raise SystemExit("cross-platform smoke contains skipped cases")
          names = {case.attrib.get("name", "") for case in cases}
          required = {
              "test_macho_handler_repair_and_codesign",
              "test_nop_insertion_arm64_preserves_native_output",
              "test_instruction_substitution_arm64_preserves_native_output",
              "test_register_substitution_arm64_preserves_generated_native_execution",
              "test_instruction_substitution_pe_x86_64_preserves_real_integrity",
              "test_code_virtualization_pe_x86_64_target_is_rejected_before_mutation",
              "test_code_virtualization_macho_arm64_target_is_rejected_before_mutation",
          }
          missing = [prefix for prefix in required if not any(name.startswith(prefix) for name in names)]
          if missing:
              raise SystemExit(f"cross-platform smoke coverage drift: {missing}")
          Path("cross-platform-differential.xml").stat()
          PY

      - name: Upload native cross-platform differential evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-platform-differential-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: cross-platform-differential.xml

  cross-platform-format-windows:
    name: Cross-platform format differential (Windows PE)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install radare2 (Windows)
        shell: pwsh
        run: |
          $version = "6.2.0"
          $archiveName = "radare2-$version-w64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/radareorg/radare2/releases/download/$version/$archiveName"
          $expectedSha256 = "adb1ffd158066ea41316fa33b6d23b362aa9258df800721f7d15a42eefdd9202"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "radare2 archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          $destination = Join-Path $env:RUNNER_TEMP "radare2-$version"
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $bin = Join-Path $destination "radare2-$version-w64\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "r2.bat") -v

      - name: Install package dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt

      - name: Build and install package wheel
        shell: pwsh
        run: |
          python -m build
          python -m pip install --force-reinstall (Get-ChildItem dist/*.whl)

      - name: Run Windows PE format differential smoke
        shell: pwsh
        run: |
          $wheelRoot = Join-Path $env:RUNNER_TEMP "r2morph-windows-format-wheel-check"
          Remove-Item -Recurse -Force $wheelRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $wheelRoot | Out-Null
          Copy-Item -Recurse tests,fixtures,scripts,pyproject.toml $wheelRoot
          Set-Location $wheelRoot
          python -W error -m pytest -q --no-cov --tb=short `
            --junitxml="$env:GITHUB_WORKSPACE/windows-format-differential.xml" `
            tests/integration/test_platform_deeper.py `
            tests/integration/test_platform_handlers_deeper_real_more.py `
            tests/integration/test_platform_handlers_extended.py `
            tests/integration/test_platform_handlers_real.py `
            tests/integration/test_nop_insertion_pe_real.py::test_instruction_substitution_pe_fixture_preserves_windows_exit_code `
            -k "pe_handler or instruction_substitution_pe_fixture_preserves_windows_exit_code"

      - name: Validate Windows PE format differential evidence
        shell: pwsh
        run: |
          [xml]$suite = Get-Content windows-format-differential.xml
          $cases = @($suite.SelectNodes("//testcase"))
          if ($cases.Count -ne 5) { throw "Windows PE smoke ran $($cases.Count) cases; expected 5" }
          if ($suite.SelectNodes("//failure").Count -gt 0 -or $suite.SelectNodes("//error").Count -gt 0) {
            throw "Windows PE smoke contains failures or errors"
          }
          if ($suite.SelectNodes("//skipped").Count -gt 0) { throw "Windows PE smoke contains skipped cases" }
          $required = @(
            "test_pe_handler_checksum",
            "test_pe_handler_checksum_and_imports",
            "test_pe_handler_extended",
            "test_pe_handler_real_binary",
            "test_instruction_substitution_pe_fixture_preserves_windows_exit_code"
          )
          foreach ($name in $required) {
            if (-not ($cases | Where-Object { $_.name -like "$name*" })) {
              throw "Windows PE smoke is missing $name"
            }
          }

      - name: Upload Windows PE differential evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-platform-differential-windows-pe-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-format-differential.xml

  public-compatibility-corpus:
    name: Public compatibility corpus
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout r2morph
        uses: actions/checkout@v5

      - name: Checkout public corpus
        uses: actions/checkout@v5
        with:
          repository: seifreed/r2morph-corpus
          ref: 8bca169321a4ead73ccc9bdcd3437acc40cc4649
          path: public-corpus

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies and r2morph wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Build public compatibility corpus
        run: |
          python public-corpus/scripts/build_corpus.py \
            --source-root public-corpus/sources \
            --output public-corpus/build

      - name: Validate public corpus manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("public-corpus/build/manifest.json").read_text(encoding="utf-8"))
          if manifest["target"] != {"os": "linux", "format": "ELF", "architecture": "x86-64"}:
              raise SystemExit(f"unexpected public corpus target: {manifest['target']}")
          built = [row for row in manifest["records"] if row["status"] == "built"]
          if not built:
              raise SystemExit("public compatibility corpus produced no built samples")
          print(f"public corpus built samples: {len(built)}")
          PY

      - name: Select bounded public corpus matrix
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          build_root = Path("public-corpus/build")
          selected_root = Path("public-corpus/build-selected")
          selected_root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((build_root / "manifest.json").read_text(encoding="utf-8"))
          variants = (
              ("O0", "non-pie", "symbols", "dynamic"),
              ("O2", "pie", "stripped", "dynamic"),
              ("O3", "non-pie", "symbols", "static"),
          )

          def source_name(record: dict[str, object]) -> str:
              return str(record["id"]).split("-", 5)[1]

          selected = []
          for record in manifest["records"]:
              if record.get("status") != "built":
                  continue
              key = (
                  str(record["optimization"]),
                  str(record["pie"]),
                  str(record["symbols"]),
                  str(record["link"]),
              )
              if key not in variants:
                  continue
              source = build_root / str(record["id"])
              shutil.copy2(source, selected_root / source.name)
              selected.append(record)

          if not selected:
              raise SystemExit("bounded public corpus selection is empty")
          selected_manifest = {
              "schema_version": manifest["schema_version"],
              "target": manifest["target"],
              "selection": {
                  "variants": [
                      {
                          "optimization": optimization,
                          "pie": pie,
                          "symbols": symbols,
                          "link": link,
                      }
                      for optimization, pie, symbols, link in variants
                  ],
                  "source_count": len({source_name(record) for record in selected}),
                  "compiler_count": len({record["compiler"] for record in selected}),
              },
              "records": selected,
          }
          (selected_root / "manifest.json").write_text(
              json.dumps(selected_manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if selected_manifest["selection"]["source_count"] < 36:
              raise SystemExit("bounded public corpus selection lost a source family")
          if selected_manifest["selection"]["compiler_count"] < 2:
              raise SystemExit("bounded public corpus selection lost a compiler")
          print(f"bounded public corpus samples: {len(selected)}")
          PY

      - name: Run public differential matrix
        run: |
          python public-corpus/scripts/run_matrix.py \
            --build public-corpus/build-selected \
            --output public-corpus/results \
            --seed 20260914 \
            --workers 4 \
            --report-only

      - name: Validate public differential matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("public-corpus/build-selected/manifest.json").read_text(encoding="utf-8")
          )
          report = json.loads(Path("public-corpus/results/matrix.json").read_text(encoding="utf-8"))
          expected_passes = {
              "BlockReordering",
              "CodeVirtualization",
              "InstructionExpansion",
              "InstructionSubstitution",
              "NopInsertion",
              "RegisterSubstitution",
          }
          if set(report["passes"]) != expected_passes:
              raise SystemExit(f"public corpus pass selection drift: {report['passes']}")
          if report["built_samples"] != len(manifest["records"]):
              raise SystemExit("public matrix does not cover the bounded selection")
          if report["built_samples"] == 0 or report["failed_samples"] != 0:
              raise SystemExit(f"public differential failures: {report['failed_samples']}")
          for pass_name, summary in report["pass_summary"].items():
              if summary["samples"] != report["built_samples"]:
                  raise SystemExit(f"incomplete public pass coverage: {pass_name}")
              if summary["differential_failed"] != 0 or summary["errors"] != 0:
                  raise SystemExit(f"public differential evidence failed: {pass_name}")
              if summary["applied"] == 0:
                  raise SystemExit(f"public pass was never applied: {pass_name}")
          print(f"public differential samples: {report['passed_samples']}")
          PY

      - name: Run public static recovery benchmark
        run: |
          python public-corpus/scripts/tool_benchmark.py \
            --build public-corpus/build-selected \
            --matrix public-corpus/results/matrix.json \
            --output public-corpus/results/tools.json \
            --workers 8 \
            --report-only

      - name: Validate public static recovery benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("public-corpus/results/matrix.json").read_text(encoding="utf-8"))
          benchmark = json.loads(Path("public-corpus/results/tools.json").read_text(encoding="utf-8"))
          expected_measurements = sum(item["samples"] for item in report["pass_summary"].values())
          if benchmark["status"] != "passed":
              raise SystemExit("public static recovery benchmark did not pass")
          if benchmark["measured_samples"] != expected_measurements:
              raise SystemExit("public static recovery benchmark is incomplete")
          print(f"public static recovery samples: {benchmark['measured_samples']}")
          PY

      - name: Upload public compatibility evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-compatibility-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public-corpus/manifest.json
            public-corpus/build/manifest.json
            public-corpus/build-selected/manifest.json
            public-corpus/results/matrix.json
            public-corpus/results/tools.json

  elf-arm64-native:
    name: Native ELF ARM64 differential
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run native ELF ARM64 differential
        run: |
          pytest -W error -q --no-cov --tb=short \
            --junitxml=elf-arm64-native.xml \
            tests/integration/test_elf_arm64_native.py

      - name: Validate native ELF ARM64 evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          suite = ET.parse("elf-arm64-native.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) != 3:
              raise SystemExit(f"unexpected ELF ARM64 case count: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error") or suite.findall(".//skipped"):
              raise SystemExit("native ELF ARM64 evidence is incomplete")
          if not any(
              case.attrib.get("name", "").startswith("test_elf_arm64_nop_insertion_preserves_native_exit_code")
              for case in cases
          ):
              raise SystemExit("native ELF ARM64 test name is missing")
          if not any(
              case.attrib.get("name", "").startswith(
                  "test_elf_arm64_instruction_substitution_preserves_native_exit_code"
              )
              for case in cases
          ):
              raise SystemExit("native ELF ARM64 substitution test name is missing")
          if not any(
              case.attrib.get("name", "").startswith(
                  "test_elf_arm64_register_substitution_preserves_native_exit_code"
              )
              for case in cases
          ):
              raise SystemExit("native ELF ARM64 register substitution test name is missing")
          PY

      - name: Upload native ELF ARM64 evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: elf-arm64-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: elf-arm64-native.xml

