name: Differential Corpus By Pass

"on":
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  differential-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Build and install package wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Run full differential corpus
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R scripts tests fixtures pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes all \
            --require-applied \
            --require-complete-evidence \
            --generated-inputs \
            --generated-corpus \
            --first-seed 20260901 \
            --count 3 \
            --output "$GITHUB_WORKSPACE/differential-corpus.json"

      - name: Validate differential campaign summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("differential-corpus.json").read_text(encoding="utf-8"))
          summary = report["campaign_summary"]
          if summary["platform_scope"] != {"os": "linux", "format": "ELF", "architecture": "x86-64"}:
              raise SystemExit(f"unexpected platform scope: {summary['platform_scope']}")
          if summary["platform_gap_scope"] != {"formats": ["Mach-O", "PE"], "architectures": ["AArch64", "ARM", "x86"]}:
              raise SystemExit(f"unexpected platform gap scope: {summary['platform_gap_scope']}")
          if summary["input_sources"] != ["default-argv", "generated-argv"]:
              raise SystemExit(f"unexpected input sources: {summary['input_sources']}")
          if summary["corpus_families"] != ["repository-fixtures", "generated-elf-x86-64"]:
              raise SystemExit(f"unexpected corpus families: {summary['corpus_families']}")
          if summary["generated_fixture_count"] != 12:
              raise SystemExit(f"unexpected generated fixture count: {summary['generated_fixture_count']}")
          expected_generated = sorted(
              f"{source}_{profile}"
              for source in ("generated_branch", "generated_lookup", "generated_memory")
              for profile in ("gcc-o0", "gcc-o2", "gcc-pie-o2", "clang-o2")
          )
          if summary["generated_fixture_names"] != expected_generated:
              raise SystemExit(f"unexpected generated fixture names: {summary['generated_fixture_names']}")
          if summary["corpus_gap_scope"] != {"corpus_families": [], "input_sources": []}:
              raise SystemExit(f"unexpected corpus gap scope: {summary['corpus_gap_scope']}")
          if summary["corpus_scope"] != {"dataset": "fixtures/dataset"}:
              raise SystemExit(f"unexpected corpus scope: {summary['corpus_scope']}")
          if summary["missing_corpus_passes"]:
              raise SystemExit(f"missing corpus passes: {summary['missing_corpus_passes']}")
          if summary["total_complete_evidence_missing_runs"] != 0:
              raise SystemExit("differential report has incomplete evidence")
          if summary["passes_with_incomplete_coverage"]:
              raise SystemExit(f"incomplete coverage: {summary['passes_with_incomplete_coverage']}")
          allowed = {
              "platform_gap_scope": summary["platform_gap_scope"],
              "corpus_gap_scope": summary["corpus_gap_scope"],
          }
          unexpected = {
              key: value
              for key, value in summary["continuous_evidence_blockers"].items()
              if key not in allowed or value != allowed[key]
          }
          if unexpected:
              reasons = summary.get("runtime_observable_failure_reasons_by_pass", {})
              raise SystemExit(
                  "unexpected continuous evidence blockers: "
                  f"{unexpected}; runtime failure reasons by pass: {reasons}"
              )
          PY

      - name: Run cross-format differential smoke
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/cross-format-differential.xml" \
            tests/integration/test_binary_rewriter_formats_real.py \
            tests/integration/test_platform_deeper.py \
            tests/integration/test_mutation_passes_end_to_end_more2.py \
            tests/integration/test_mutation_nop_insertion_arm64.py \
            tests/integration/test_code_virtualization_target_support_real.py

      - name: Validate cross-format differential evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("cross-format-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 10:
              raise SystemExit(f"cross-format smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("cross-format smoke contains failures or errors")
          names = {case.attrib.get("name", "") for case in cases}
          required = {
              "test_binary_rewriter_analyze_binary_formats",
              "test_binary_rewriter_rewrite_no_patches",
              "test_binary_rewriter_noop_preserves_real_format",
              "test_elf_handler_symbols_and_preserve",
              "test_pe_handler_checksum",
              "test_macho_handler_repair_and_codesign",
              "test_multiple_mutation_passes_on_x86_binary",
              "test_instruction_substitution_pe_x86_64_preserves_real_integrity",
              "test_nop_insertion_arm64_path",
              "test_nop_insertion_arm64_does_not_record_encoding_identical_rewrites",
              "test_instruction_substitution_arm64_changes_real_instruction_encoding",
              "test_code_virtualization_pe_x86_64_target_is_rejected_before_mutation",
              "test_code_virtualization_macho_arm64_target_is_rejected_before_mutation",
            }
          if not all(any(name.startswith(prefix) for name in names) for prefix in required):
              raise SystemExit(f"cross-format smoke coverage drift: {sorted(names)}")
          Path("cross-format-differential.xml").stat()
          PY

      - name: Run composition regression smoke
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/composition-differential.xml" \
            tests/integration/test_polymorphic_engine_real.py

      - name: Validate composition differential evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("composition-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 7:
              raise SystemExit(f"composition smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("composition smoke contains failures or errors")
          names = {case.attrib.get("name", "") for case in cases}
          required = {
              "test_polymorphic_engine_reports_composed_mutations_and_preserves_exit_code",
              "test_composed_real_passes_preserve_exit_code[nop_then_substitution]",
              "test_composed_real_passes_preserve_exit_code[constant_then_substitution]",
              "test_composed_real_passes_preserve_exit_code[nop_then_constant]",
              "test_composed_real_passes_preserve_exit_code[constant_then_nop]",
              "test_composed_real_passes_preserve_exit_code[substitution_then_nop]",
              "test_composed_real_passes_preserve_exit_code[substitution_then_constant]",
          }
          if not required.issubset(names):
              raise SystemExit(f"composition smoke coverage drift: {sorted(names)}")
          Path("composition-differential.xml").stat()
          PY

      - name: Run VM semantic regression smoke
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/vm-semantic-differential.xml" \
            tests/integration/test_code_virtualization_memory_widths_real.py::test_memory_width_fixture_virtualization_preserves_exit_code \
            tests/integration/test_code_virtualization_call_callee_saved_real.py::test_virtualized_callee_saved_fixture_preserves_registers \
            tests/integration/test_code_virtualization_call_flags_stack_real.py::test_call_flags_stack_fixture_virtualization_preserves_exit_code \
            tests/integration/test_code_virtualization_tls_real.py::test_virtualized_elf_preserves_fs_relative_access \
            tests/integration/test_code_virtualization_threads_signals_real.py::test_virtualized_threads_tls_and_signal_preserve_exit_code \
            tests/integration/test_code_virtualization_call_abi_real.py::test_virtualized_elf_preserves_integer_varargs_stack_abi \
            tests/integration/test_code_virtualization_call_abi_real.py::test_virtualized_elf_preserves_floating_point_varargs_register_and_stack_abi \
            tests/integration/test_code_virtualization_internal_icall_real.py::test_virtualized_direct_call_to_separate_function_preserves_exit_code \
            tests/integration/test_code_virtualization_internal_icall_real.py::test_virtualized_local_indirect_call_preserves_exit_code \
            tests/integration/test_code_virtualization_fp_vex_nondestructive_real.py::test_virtualized_vex_nondestructive_packed_add_preserves_result \
            tests/integration/test_code_virtualization_simd_integer_real.py::test_simd_integer_fixture_virtualization_preserves_exit_code \
            tests/integration/test_code_virtualization_exception_gate_real.py::test_code_virtualization_preserves_exception_from_call_inside_virtualized_function \
            tests/integration/test_code_virtualization_generic_isa_real.py \
            tests/unit/test_code_virtualization_static_dataflow.py \
            tests/integration/test_code_virtualization_memory_widths_real.py \
            tests/integration/test_code_virtualization_tls_widths_real.py \
            tests/integration/test_code_virtualization_call_abi_real.py \
            tests/integration/test_code_virtualization_fp_compare_memory_real.py \
            tests/integration/test_code_virtualization_simd_move_real.py \
            tests/integration/test_code_virtualization_threads_signals_real.py

      - name: Validate VM semantic differential evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("vm-semantic-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 55:
              raise SystemExit(f"VM semantic smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("VM semantic smoke contains failures or errors")
          names = "\n".join(case.attrib.get("name", "") for case in cases)
          required = (
              "test_memory_width_fixture_virtualization_preserves_exit_code",
              "test_virtualized_callee_saved_fixture_preserves_registers",
              "test_virtualized_elf_preserves_fs_relative_access",
              "test_virtualized_threads_tls_and_signal_preserve_exit_code",
              "test_virtualized_elf_preserves_integer_varargs_stack_abi",
              "test_virtualized_elf_preserves_floating_point_varargs_register_and_stack_abi",
              "test_virtualized_direct_call_to_separate_function_preserves_exit_code",
              "test_virtualized_local_indirect_call_preserves_exit_code",
              "test_virtualized_vex_nondestructive_packed_add_preserves_result",
              "test_simd_integer_fixture_virtualization_preserves_exit_code",
              "test_code_virtualization_preserves_exception_from_call_inside_virtualized_function",
              "test_static_dataflow",
              "test_virtualized_byte_word_memory_arithmetic_preserves_result",
              "test_virtualized_no_base_indexed_memory_arithmetic_preserves_result",
              "test_tls_byte_and_word_virtualization_preserves_exit_code",
              "test_virtualized_elf_preserves_vector_call_abi",
              "test_virtualized_elf_preserves_incoming_stack_argument",
              "test_fpcmp_memory_fixture_virtualization_preserves_exit_code",
              "test_simd_move_fixture_virtualization_preserves_both_qwords",
              "test_virtualized_async_signal_inside_vm_preserves_exit_code",
          )
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"VM semantic smoke coverage drift: {missing}")
          Path("vm-semantic-differential.xml").stat()
          PY

      - name: Run parser and rewriter fuzz smoke
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python scripts/continuous_fuzz.py \
            --cases 64 \
            --seed 20260827 \
            --max-payload 512 \
            --output "$GITHUB_WORKSPACE/differential-fuzz-smoke.json"

      - name: Validate parser and rewriter fuzz smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("differential-fuzz-smoke.json").read_text(encoding="utf-8"))
          expected_targets = {
              "binary_parsers": 64,
              "vm_dispatcher": 64,
              "relocations": 64,
              "binary_rewriter": 64,
          }
          if report["failure_count"] != 0:
              raise SystemExit(f"fuzz smoke failures: {report['failures']}")
          if report["target_runs"] != expected_targets:
              raise SystemExit(f"unexpected fuzz target runs: {report['target_runs']}")
          PY

      - name: Run extended maturity pass smoke
        env:
          EXTENDED_MATURITY_PASSES: >-
            AntiDisassembly,APIHashing,CodeMobility,DataFlowMutation,
            FunctionOutlining,ImportObfuscation,OpaquePredicates,
            PolymorphicEngine,SelfModifyingCode,ShortJumpPatching,
            StackStrings,StringObfuscation
        run: |
          wheel_root=/tmp/r2morph-differential-wheel-check
          cd "$wheel_root"
          python scripts/protection_maturity_baseline.py \
            --all \
            --dataset fixtures/dataset \
            --passes "$EXTENDED_MATURITY_PASSES" \
            --first-seed 20260901 \
            --count 1 \
            --output "$GITHUB_WORKSPACE/extended-maturity-passes.json"

      - name: Validate extended maturity pass smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = [
              "AntiDisassembly",
              "APIHashing",
              "CodeMobility",
              "DataFlowMutation",
              "FunctionOutlining",
              "ImportObfuscation",
              "OpaquePredicates",
              "PolymorphicEngine",
              "SelfModifyingCode",
              "ShortJumpPatching",
              "StackStrings",
              "StringObfuscation",
          ]
          report = json.loads(Path("extended-maturity-passes.json").read_text(encoding="utf-8"))
          if report["pass_names"] != expected:
              raise SystemExit(f"unexpected extended pass names: {report['pass_names']}")
          if report["campaign_summary"]["pass_count"] != len(expected):
              raise SystemExit(f"unexpected extended pass count: {report['campaign_summary']['pass_count']}")
          if report["campaign_summary"]["missing_extended_passes"]:
              raise SystemExit(f"missing extended pass rows: {report['campaign_summary']['missing_extended_passes']}")
          if set(report["summary"]) != set(expected):
              raise SystemExit("extended maturity summary is missing pass rows")
          if "passes_without_extended_applied_runs" not in report["campaign_summary"]:
              raise SystemExit("extended maturity summary is missing passes_without_extended_applied_runs")
          if "extended_maturity_evidence_blockers" not in report["campaign_summary"]:
              raise SystemExit("extended maturity summary is missing extended_maturity_evidence_blockers")
          if "total_extended_maturity_evidence_blockers" not in report["campaign_summary"][
              "extended_maturity_evidence_blocker_totals"
          ]:
              raise SystemExit("extended maturity blocker totals are missing total_extended_maturity_evidence_blockers")
          if report["campaign_summary"]["extended_passes_with_error_runs"]:
              raise SystemExit(
                  f"extended maturity pass errors: {report['campaign_summary']['extended_passes_with_error_runs']}"
              )
          required_metrics = {"output_size", "runtime_duration", "static_metric", "transform_duration"}
          missing_metrics = {
              name: count
              for name, count in report["campaign_summary"]["metric_missing_runs"].items()
              if name in required_metrics and count != 0
          }
          if missing_metrics:
              raise SystemExit(f"extended maturity performance metrics are incomplete: {missing_metrics}")
          incomplete_metrics = {
              name: passes
              for name, passes in report["campaign_summary"]["passes_with_incomplete_coverage"].items()
              if name in required_metrics and passes
          }
          if incomplete_metrics:
              raise SystemExit(f"extended maturity performance coverage is incomplete: {incomplete_metrics}")
          PY

      - name: Upload per-pass differential report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: differential-corpus-by-pass
          path: differential-corpus.json

      - name: Upload cross-format differential evidence
        uses: actions/upload-artifact@v7
        with:
          name: cross-format-differential
          path: cross-format-differential.xml

      - name: Upload VM semantic differential evidence
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('vm-semantic-differential.xml') != ''
        with:
          name: vm-semantic-differential
          path: vm-semantic-differential.xml

      - name: Upload composition differential evidence
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('composition-differential.xml') != ''
        with:
          name: composition-differential
          path: composition-differential.xml

      - name: Upload extended maturity pass smoke
        uses: actions/upload-artifact@v7
        with:
          name: extended-maturity-passes
          path: extended-maturity-passes.json

      - name: Upload differential fuzz smoke
        uses: actions/upload-artifact@v7
        with:
          name: differential-fuzz-smoke
          path: differential-fuzz-smoke.json

  cross-platform-differential:
    name: Cross-platform differential (macOS ARM64)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install radare2
        run: |
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Run native cross-platform differential smoke
        run: |
          wheel_root=/tmp/r2morph-cross-platform-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R tests fixtures scripts pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/cross-platform-differential.xml" \
            tests/integration/test_binary_rewriter_formats_real.py \
            tests/integration/test_platform_deeper.py \
            tests/integration/test_mutation_nop_insertion_arm64.py \
            tests/integration/test_mutation_register_substitution_arm64.py \
            tests/integration/test_mutation_passes_end_to_end_more2.py \
            tests/integration/test_code_virtualization_target_support_real.py

      - name: Validate native cross-platform differential evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suite = ET.parse("cross-platform-differential.xml").getroot()
          cases = suite.findall(".//testcase")
          if len(cases) < 20:
              raise SystemExit(f"cross-platform smoke ran too few cases: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error"):
              raise SystemExit("cross-platform smoke contains failures or errors")
          if suite.findall(".//skipped"):
              raise SystemExit("cross-platform smoke contains skipped cases")
          names = {case.attrib.get("name", "") for case in cases}
          required = {
              "test_macho_handler_repair_and_codesign",
              "test_nop_insertion_arm64_preserves_native_output",
              "test_instruction_substitution_arm64_preserves_native_output",
              "test_register_substitution_arm64_preserves_generated_native_execution",
              "test_instruction_substitution_pe_x86_64_preserves_real_integrity",
              "test_code_virtualization_pe_x86_64_target_is_rejected_before_mutation",
              "test_code_virtualization_macho_arm64_target_is_rejected_before_mutation",
          }
          missing = [prefix for prefix in required if not any(name.startswith(prefix) for name in names)]
          if missing:
              raise SystemExit(f"cross-platform smoke coverage drift: {missing}")
          Path("cross-platform-differential.xml").stat()
          PY

      - name: Upload native cross-platform differential evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-platform-differential-macos-arm64
          path: cross-platform-differential.xml

  public-compatibility-corpus:
    name: Public compatibility corpus
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout r2morph
        uses: actions/checkout@v5

      - name: Checkout public corpus
        uses: actions/checkout@v5
        with:
          repository: seifreed/r2morph-corpus
          ref: 8bca169321a4ead73ccc9bdcd3437acc40cc4649
          path: public-corpus

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies and r2morph wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Build public compatibility corpus
        run: |
          python public-corpus/scripts/build_corpus.py \
            --source-root public-corpus/sources \
            --output public-corpus/build

      - name: Validate public corpus manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("public-corpus/build/manifest.json").read_text(encoding="utf-8"))
          if manifest["target"] != {"os": "linux", "format": "ELF", "architecture": "x86-64"}:
              raise SystemExit(f"unexpected public corpus target: {manifest['target']}")
          built = [row for row in manifest["records"] if row["status"] == "built"]
          if not built:
              raise SystemExit("public compatibility corpus produced no built samples")
          print(f"public corpus built samples: {len(built)}")
          PY

      - name: Select bounded public corpus matrix
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          build_root = Path("public-corpus/build")
          selected_root = Path("public-corpus/build-selected")
          selected_root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((build_root / "manifest.json").read_text(encoding="utf-8"))
          variants = (
              ("O0", "non-pie", "symbols", "dynamic"),
              ("O2", "pie", "stripped", "dynamic"),
              ("O3", "non-pie", "symbols", "static"),
          )

          def source_name(record: dict[str, object]) -> str:
              return str(record["id"]).split("-", 5)[1]

          selected = []
          for record in manifest["records"]:
              if record.get("status") != "built":
                  continue
              key = (
                  str(record["optimization"]),
                  str(record["pie"]),
                  str(record["symbols"]),
                  str(record["link"]),
              )
              if key not in variants:
                  continue
              source = build_root / str(record["id"])
              shutil.copy2(source, selected_root / source.name)
              selected.append(record)

          if not selected:
              raise SystemExit("bounded public corpus selection is empty")
          selected_manifest = {
              "schema_version": manifest["schema_version"],
              "target": manifest["target"],
              "selection": {
                  "variants": [
                      {
                          "optimization": optimization,
                          "pie": pie,
                          "symbols": symbols,
                          "link": link,
                      }
                      for optimization, pie, symbols, link in variants
                  ],
                  "source_count": len({source_name(record) for record in selected}),
                  "compiler_count": len({record["compiler"] for record in selected}),
              },
              "records": selected,
          }
          (selected_root / "manifest.json").write_text(
              json.dumps(selected_manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          if selected_manifest["selection"]["source_count"] < 36:
              raise SystemExit("bounded public corpus selection lost a source family")
          if selected_manifest["selection"]["compiler_count"] < 2:
              raise SystemExit("bounded public corpus selection lost a compiler")
          print(f"bounded public corpus samples: {len(selected)}")
          PY

      - name: Run public differential matrix
        run: |
          python public-corpus/scripts/run_matrix.py \
            --build public-corpus/build-selected \
            --output public-corpus/results \
            --seed 20260914 \
            --workers 16 \
            --report-only

      - name: Validate public differential matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("public-corpus/build-selected/manifest.json").read_text(encoding="utf-8")
          )
          report = json.loads(Path("public-corpus/results/matrix.json").read_text(encoding="utf-8"))
          expected_passes = {
              "BlockReordering",
              "CodeVirtualization",
              "InstructionExpansion",
              "InstructionSubstitution",
              "NopInsertion",
              "RegisterSubstitution",
          }
          if set(report["passes"]) != expected_passes:
              raise SystemExit(f"public corpus pass selection drift: {report['passes']}")
          if report["built_samples"] != len(manifest["records"]):
              raise SystemExit("public matrix does not cover the bounded selection")
          if report["built_samples"] == 0 or report["failed_samples"] != 0:
              raise SystemExit(f"public differential failures: {report['failed_samples']}")
          for pass_name, summary in report["pass_summary"].items():
              if summary["samples"] != report["built_samples"]:
                  raise SystemExit(f"incomplete public pass coverage: {pass_name}")
              if summary["differential_failed"] != 0 or summary["errors"] != 0:
                  raise SystemExit(f"public differential evidence failed: {pass_name}")
              if summary["applied"] == 0:
                  raise SystemExit(f"public pass was never applied: {pass_name}")
          print(f"public differential samples: {report['passed_samples']}")
          PY

      - name: Run public static recovery benchmark
        run: |
          python public-corpus/scripts/tool_benchmark.py \
            --build public-corpus/build-selected \
            --matrix public-corpus/results/matrix.json \
            --output public-corpus/results/tools.json \
            --workers 8 \
            --report-only

      - name: Validate public static recovery benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("public-corpus/results/matrix.json").read_text(encoding="utf-8"))
          benchmark = json.loads(Path("public-corpus/results/tools.json").read_text(encoding="utf-8"))
          expected_measurements = sum(item["samples"] for item in report["pass_summary"].values())
          if benchmark["status"] != "passed":
              raise SystemExit("public static recovery benchmark did not pass")
          if benchmark["measured_samples"] != expected_measurements:
              raise SystemExit("public static recovery benchmark is incomplete")
          print(f"public static recovery samples: {benchmark['measured_samples']}")
          PY

      - name: Upload public compatibility evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-compatibility-corpus
          path: |
            public-corpus/manifest.json
            public-corpus/build/manifest.json
            public-corpus/build-selected/manifest.json
            public-corpus/results/matrix.json
            public-corpus/results/tools.json
