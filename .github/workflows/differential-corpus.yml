  aggregate-platform-differential:
    name: Aggregate platform differential evidence
    needs:
      - cross-platform-differential
      - cross-platform-format-windows
      - elf-arm64-native
      - elf-x86-32-native
      - elf-arm-32-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout r2morph
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install evidence dependencies
        run: python -m pip install "defusedxml>=0.7.1"

      - name: Download macOS ARM64 evidence
        uses: actions/download-artifact@v8
        with:
          name: cross-platform-differential-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-evidence/macos-arm64

      - name: Download Windows PE evidence
        uses: actions/download-artifact@v8
        with:
          name: cross-platform-differential-windows-pe-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-evidence/windows-pe

      - name: Download ELF ARM64 evidence
        uses: actions/download-artifact@v8
        with:
          name: elf-arm64-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-evidence/elf-arm64

      - name: Download ELF x86 32-bit evidence
        uses: actions/download-artifact@v8
        with:
          name: elf-x86-32-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-evidence/elf-x86-32

      - name: Download ELF ARM32 evidence
        uses: actions/download-artifact@v8
        with:
          name: elf-arm-32-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-evidence/elf-arm-32

      - name: Validate aggregated platform evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = {
              "macos-arm64": "test_nop_insertion_arm64_preserves_native_output",
              "windows-pe": "test_pe_handler_checksum",
              "elf-arm64": "test_elf_arm64_register_substitution_preserves_native_exit_code",
              "elf-x86-32": "test_elf_x86_32_instruction_substitution_preserves_native_exit_code",
              "elf-arm-32": "test_elf_arm32_instruction_substitution_preserves_emulated_exit_code",
          }
          root = Path("platform-evidence")
          for platform, required_name in expected.items():
              reports = sorted((root / platform).glob("*.xml"))
              if len(reports) != 1:
                  raise SystemExit(f"expected one {platform} report, found {reports}")
              suite = ET.parse(reports[0]).getroot()
              cases = suite.findall(".//testcase")
              if not cases:
                  raise SystemExit(f"{platform} report has no test cases")
              if suite.findall(".//failure") or suite.findall(".//error") or suite.findall(".//skipped"):
                  raise SystemExit(f"{platform} report contains incomplete evidence")
              if not any(required_name in case.attrib.get("name", "") for case in cases):
                  raise SystemExit(f"{platform} report is missing {required_name}")
          PY

      - name: Build platform evidence summary
        run: |
          python scripts/platform_evidence.py \
            --root platform-evidence \
            --output platform-evidence-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("platform-evidence-summary.json").read_text(encoding="utf-8"))
          if report["summary"]["status"] != "complete":
              raise SystemExit(f"platform differential evidence is incomplete: {report['summary']}")
          PY

      - name: Upload aggregated platform evidence
        uses: actions/upload-artifact@v7
        with:
          name: differential-platform-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform-evidence
            platform-evidence-summary.json
