---
name: Release

"on":
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          package_version = pyproject["project"]["version"]
          tag_version = os.environ["TAG_VERSION"]

          if package_version != tag_version:
              raise SystemExit(
                  "Tag version does not match pyproject.toml version: "
                  f"v{tag_version} != {package_version}"
              )

          print(f"Release version validated: {tag_version}")
          PY

      - name: Validate support contract
        run: python scripts/check_release_contract.py

      - name: Require green CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --commit "$GITHUB_SHA" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          test "$ci_conclusion" = "success"

  build:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pip-audit

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Generate SBOM
        run: pip-audit -r requirements.txt -f cyclonedx-json -o dist/sbom.cdx.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: [validate-release, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget

      - name: Install radare2
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install package
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Verify installed package
        run: |
          python -c "import r2morph; print(r2morph.__version__)"
          python -c "import r2morph; print(r2morph.__file__)"
          r2morph --version

      - name: Install test dependencies
        run: pip install -r requirements.txt

      - name: Run tests against installed wheel
        run: |
          test_root=/tmp/r2morph-release-tests
          rm -rf "$test_root"
          mkdir -p "$test_root"
          cp -R tests fixtures docs scripts pyproject.toml requirements.txt CHANGELOG.md README.md "$test_root"/
          cd "$test_root"
          python -W error -m pytest --no-cov \
            --tb=short

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [validate-release, build, test]
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/r2morph/
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-release:
    runs-on: ubuntu-latest
    needs: [validate-release, build, test, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Generate release checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.whl sbom.cdx.json > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json

      - name: Generate changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changes.md
          test -s /tmp/changes.md
          cat /tmp/changes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          body_path: /tmp/changes.md
          draft: false
          prerelease: >-
            ${{ contains(needs.validate-release.outputs.version, '-') }}
          generate_release_notes: true
