---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run ruff
        run: ruff check r2morph tests

      - name: Run black (check only)
        run: black --check r2morph tests

      - name: Validate release contract
        run: python scripts/check_release_contract.py

      - name: Validate exhaustive support matrix
        run: python scripts/support_matrix.py --check docs/support-matrix.json

      - name: Run Bandit
        run: bandit -r r2morph -c pyproject.toml

      - name: Run pip-audit
        run: pip-audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run mypy
        run: mypy r2morph

  property-validation:
    name: Property and Fuzz Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run property and fuzzer contracts
        run: |
          python -W error -m pytest -v tests/property \
            tests/unit/test_fuzzer_inputs_contract.py \
            tests/unit/test_mutation_fuzzer_campaign_contract.py \
            tests/unit/test_mutation_fuzzer_continuous_contract.py \
            --no-cov --tb=short

  stable-tests:
    name: Core Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run stable core tests with coverage
        run: |
          python -W error -m pytest -v --cov=r2morph \
            --cov-report=xml --cov-report=term-missing \
            -m "not product_smoke and not slow" \
            --ignore=tests/product_smoke --ignore=tests/slow

      - name: Upload stable coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-stable
          path: coverage.xml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run unit tests
        run: |
          python -W error -m pytest -v tests/unit \
            -m "not slow" --no-cov --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake gdb

      - name: Install radare2
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run integration tests
        run: |
          python -W error -m pytest -v tests/integration \
            -m "not slow" --no-cov --tb=short

  product-smoke-tests:
    name: Product Smoke Tests (Stable Mutations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run product smoke tests
        run: |
          python -W error -m pytest -v tests/product_smoke \
            -m "stable" --no-cov --tb=short

  cross-platform-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install pkg-config

      - name: Install radare2 (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 \
            --branch 6.2.0 \
            https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run broad Linux tests with coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python -W error -m pytest -v \
            -m "not product_smoke and not slow" \
            --cov-report=xml --tb=short

      - name: Run cross-platform package smoke tests
        if: runner.os == 'macOS' || runner.os == 'Windows' || matrix.python-version == '3.13'
        run: |
          python -W error -m pytest -v tests/unit/test_circular_imports.py tests/unit/test_cli_basic_commands.py::test_cli_version_function --no-cov --tb=short

      - name: Upload cross-platform coverage artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-cross-platform
          path: coverage.xml

  package-smoke:
    name: Installed Wheel Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          python -m build

      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/r2morph-wheel-venv
          /tmp/r2morph-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/r2morph-wheel-venv/bin/python -m pip install dist/*.whl \
            "pytest>=7.4.0" "pytest-cov>=4.1.0" \
            "hypothesis>=6.0.0" "psutil>=5.9.0"

      - name: Run tests against installed wheel
        run: |
          wheel_root=/tmp/r2morph-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R tests fixtures pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          /tmp/r2morph-wheel-venv/bin/python -c \
            "import r2morph; print(r2morph.__version__)"
          /tmp/r2morph-wheel-venv/bin/python - <<'PY'
          import r2morph

          from r2morph import Binary, MorphEngine, Pipeline

          assert r2morph.__version__
          assert Binary.__name__ == "Binary"
          assert MorphEngine.__name__ == "MorphEngine"
          assert Pipeline.__name__ == "Pipeline"
          PY
          /tmp/r2morph-wheel-venv/bin/r2morph --version
          /tmp/r2morph-wheel-venv/bin/python -c \
            "import r2morph; print(r2morph.__file__)"
          /tmp/r2morph-wheel-venv/bin/python -W error -m pytest \
            tests/unit/test_circular_imports.py \
            tests/unit/test_cli_basic_commands.py::test_cli_version_function \
            --no-cov --tb=short
