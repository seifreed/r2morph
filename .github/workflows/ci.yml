---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run ruff
        run: ruff check r2morph tests

      - name: Run black (check only)
        run: black --check r2morph tests

      - name: Validate release contract
        run: python scripts/check_release_contract.py

      - name: Validate exhaustive support matrix
        run: python scripts/support_matrix.py --check docs/support-matrix.json

      - name: Run Bandit
        run: bandit -r r2morph -c pyproject.toml

      - name: Run pip-audit
        run: pip-audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run mypy
        run: mypy r2morph

  property-validation:
    name: Property and Fuzz Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: bash .github/scripts/install_radare2.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run property and fuzzer contracts
        run: |
          python -W error -m pytest -v tests/property \
            tests/unit/test_fuzzer_inputs_contract.py \
            tests/unit/test_mutation_fuzzer_campaign_contract.py \
            tests/unit/test_mutation_fuzzer_continuous_contract.py \
            --no-cov --tb=short

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: bash .github/scripts/install_radare2.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run unit tests
        run: |
          python -W error -m pytest -v tests/unit \
            -m "not slow" --no-cov --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential clang lld gcc-arm-linux-gnueabihf qemu-user pkg-config wget cmake gdb

      - name: Install radare2
        run: bash .github/scripts/install_radare2.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run integration tests
        run: |
          python -W error -m pytest -v tests/integration \
            -m "not slow" --no-cov --tb=short

  product-smoke-tests:
    name: Product Smoke Tests (Stable Mutations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential pkg-config wget cmake

      - name: Install radare2
        run: bash .github/scripts/install_radare2.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run product smoke tests
        run: |
          python -W error -m pytest -v tests/product_smoke \
            -m "stable" --no-cov --tb=short

  cross-platform-tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-14, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential gcc-arm-linux-gnueabihf qemu-user pkg-config wget cmake

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v pkg-config >/dev/null; then
            brew install pkg-config
          fi

      - name: Install radare2 (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash .github/scripts/install_radare2.sh

      - name: Install radare2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "6.2.2"
          $archiveName = "radare2-$version-w64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/radareorg/radare2/releases/download/$version/$archiveName"
          $expectedSha256 = "adb1ffd158066ea41316fa33b6d23b362aa9258df800721f7d15a42eefdd9202"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "radare2 archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          $destination = Join-Path $env:RUNNER_TEMP "radare2-$version"
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $bin = Join-Path $destination "radare2-$version-w64\bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "r2.bat") -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run broad Linux tests with coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        timeout-minutes: 45
        run: |
          python -W error -m pytest -v \
            -m "not product_smoke and not slow" \
            --cov-report=xml --tb=short

      - name: Install build backend for cross-platform wheel smoke
        if: runner.os == 'macOS' || runner.os == 'Windows' || matrix.python-version == '3.13'
        run: python -m pip install "build>=1.2.0"

      - name: Run cross-platform package smoke tests
        if: runner.os == 'macOS' || runner.os == 'Windows' || matrix.python-version == '3.13'
        shell: bash
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          source_root = Path.cwd()
          wheel_root = Path(tempfile.mkdtemp(prefix="r2morph-cross-platform-wheel-"))
          for name in ("tests", "fixtures", "scripts", "docs", "README.md", "pyproject.toml"):
              source = source_root / name
              target = wheel_root / name
              if source.is_dir():
                  shutil.copytree(source, target)
              else:
                  shutil.copy2(source, target)
          subprocess.run([sys.executable, "-c", "import r2morph; print(r2morph.__file__)"], cwd=wheel_root, check=True)
          test_targets = [
              "tests/unit/test_circular_imports.py",
              "tests/unit/test_cli_basic_commands.py::test_cli_version_function",
              "tests/unit/test_pe_handler_parsing_contract.py",
              "tests/unit/test_pe_handler_struct_parse.py",
              "tests/unit/test_macho_parse_basic.py",
              "tests/unit/test_instruction_substitution_arm64_contract.py",
              "tests/unit/test_package_data.py",
              "tests/unit/test_support_matrix_contract.py",
              "tests/unit/test_benchmark_metrics_contract.py",
              "tests/unit/test_benchmark_runners_contract.py",
              "tests/unit/test_benchmark_reporting_summary_contract.py",
              "tests/unit/test_benchmark_reporting_breakdown_contract.py",
              "tests/unit/test_benchmark_reporting_text_contract.py",
              "tests/unit/test_benchmark_reporting_io_contract.py",
              "tests/unit/test_benchmark_reporting_exports_contract.py",
              "tests/unit/test_performance_regression_suite_contract.py",
              "tests/unit/test_performance_regression_measurement_contract.py",
              "tests/unit/test_performance_regression_execution_contract.py",
              "tests/unit/test_performance_regression_models_contract.py",
              "tests/unit/test_performance_regression_metadata_contract.py",
              "tests/unit/test_performance_regression_comparison_contract.py",
              "tests/unit/test_performance_regression_storage_contract.py",
              "tests/unit/test_pass_dependency_catalogs_contract.py",
              "tests/unit/test_evasion_scorer_helpers_contract.py",
              "tests/unit/test_enhanced_analyzer_reporting_contract.py",
              "tests/unit/test_mutation_annotator_instruction_contract.py",
              "tests/unit/test_code_virtualization_memory_widths.py",
              "tests/unit/test_code_virtualization_tls.py",
              "tests/unit/test_code_virtualization_static_dataflow.py",
              "tests/unit/test_code_virtualization_diagnostics.py",
              "tests/unit/test_code_virtualization_fp_indexed_shapes.py",
          ]
          if platform.system() != "Windows":
              test_targets.extend(
                  [
                      "tests/integration/test_binary_rewriter_formats_real.py",
                      "tests/integration/test_platform_deeper.py",
                  ]
              )
          x64_assembler_targets = [
              "tests/unit/test_code_virtualization_call_abi.py",
              "tests/unit/test_code_virtualization_avx256.py",
          ]
          if platform.machine().lower() in {"amd64", "x86_64"}:
              test_targets.extend(x64_assembler_targets)
          subprocess.run(
              [
                  sys.executable,
                  "-W",
                  "error",
                  "-m",
                  "pytest",
                  "-v",
                  *test_targets,
                  "--no-cov",
                  "--tb=short",
              ],
              cwd=wheel_root,
              check=True,
          )
          PY

      - name: Upload cross-platform coverage artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cross-platform
          path: coverage.xml

  package-smoke:
    name: Installed Wheel Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          python -m build

      - name: Install wheel in isolated environment
        run: |
          python -m venv /tmp/r2morph-wheel-venv
          /tmp/r2morph-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/r2morph-wheel-venv/bin/python -m pip install dist/*.whl \
            "pytest>=7.4.0" "pytest-cov>=4.1.0" \
            "hypothesis>=6.0.0" "psutil>=5.9.0"

      - name: Run tests against installed wheel
        run: |
          wheel_root=/tmp/r2morph-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R tests fixtures pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          /tmp/r2morph-wheel-venv/bin/python -c \
            "import r2morph; print(r2morph.__version__)"
          /tmp/r2morph-wheel-venv/bin/python - <<'PY'
          import r2morph

          from r2morph import Binary, MorphEngine, Pipeline

          assert r2morph.__version__
          assert Binary.__name__ == "Binary"
          assert MorphEngine.__name__ == "MorphEngine"
          assert Pipeline.__name__ == "Pipeline"
          PY
          /tmp/r2morph-wheel-venv/bin/r2morph --version
          /tmp/r2morph-wheel-venv/bin/python -c \
            "import r2morph; print(r2morph.__file__)"
          /tmp/r2morph-wheel-venv/bin/python -W error -m pytest \
            tests/unit/test_circular_imports.py \
            tests/unit/test_cli_basic_commands.py::test_cli_version_function \
            --no-cov --tb=short
