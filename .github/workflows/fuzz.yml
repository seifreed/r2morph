name: Continuous Fuzzing

concurrency:
  group: continuous-fuzz-${{ github.ref }}
  cancel-in-progress: true

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "pyproject.toml"
      - "requirements.txt"
      - "r2morph/**"
      - "scripts/continuous_fuzz.py"
      - "tests/property/**"
      - "tests/unit/test_fuzzer_inputs_contract.py"
      - "tests/unit/test_mutation_fuzzer_campaign_contract.py"
      - "tests/unit/test_mutation_fuzzer_continuous_contract.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: "Number of deterministic generated inputs"
        required: false
        default: "5000"
      seed:
        description: "Campaign seed"
        required: false
        default: "20260827"

jobs:
  parser-and-rewriter:
    name: parser-and-rewriter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt

      - name: Build and install package wheel
        run: |
          python -m build
          # Unix: python -m pip install --force-reinstall dist/*.whl; Bash on Windows does not expand globs.
          wheel_path="$(python -c "from pathlib import Path; print(next(Path('dist').glob('*.whl')).resolve().as_posix())")"
          python -m pip install --force-reinstall "$wheel_path"

      - name: Fuzz assembly, parsers, VM codegen, relocations, and rewriting
        shell: bash
        run: |
          cases="${{ inputs.cases || '5000' }}"
          seed="${{ inputs.seed || '20260827' }}"
          wheel_root=/tmp/r2morph-fuzz-wheel-check
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_root="$(cygpath -u "$RUNNER_TEMP")/r2morph-fuzz-wheel-check"
          fi
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R scripts fixtures "$wheel_root"/
          cd "$wheel_root"
          python -c "import r2morph; print(r2morph.__file__)"
          python scripts/continuous_fuzz.py \
            --cases "$cases" \
            --seed "$seed" \
            --output "$GITHUB_WORKSPACE/fuzz-campaign.json"

      - name: Validate continuous fuzz campaign
        shell: bash
        env:
          CASES: ${{ inputs.cases || '5000' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("fuzz-campaign.json").read_text(encoding="utf-8"))
          cases = int(os.environ["CASES"])
          expected_targets = {
              "assembling": cases,
              "binary_parsers": cases,
              "elf_header_parser": cases,
              "pe_header_parser": cases,
              "macho_load_commands": cases,
              "vm_dispatcher": cases,
              "vm_bytecode": cases,
              "relocations": cases,
              "binary_rewriter": cases,
          }
          if report["schema_version"] != 1:
              raise SystemExit(f"unexpected fuzz report schema: {report['schema_version']}")
          if report["cases"] != cases or report["target_runs"] != expected_targets:
              raise SystemExit(f"unexpected fuzz campaign scope: {report}")
          if report["failure_count"] != 0 or report["failures"]:
              raise SystemExit(f"continuous fuzz campaign failures: {report['failures']}")
          PY

      - name: Upload campaign report
        uses: actions/upload-artifact@v7
        if: always() && !cancelled()
        with:
          name: continuous-fuzz-report-${{ matrix.os }}
          path: fuzz-campaign.json
