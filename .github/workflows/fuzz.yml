name: Continuous Fuzzing

"on":
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      cases:
        description: "Number of deterministic generated inputs"
        required: false
        default: "5000"
      seed:
        description: "Campaign seed"
        required: false
        default: "20260827"

jobs:
  parser-and-rewriter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt

      - name: Build and install package wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Fuzz parsers, VM dispatch, relocations, and rewriting
        run: |
          cases="${{ inputs.cases || '5000' }}"
          seed="${{ inputs.seed || '20260827' }}"
          wheel_root=/tmp/r2morph-fuzz-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R scripts fixtures "$wheel_root"/
          cd "$wheel_root"
          python -c "import r2morph; print(r2morph.__file__)"
          python scripts/continuous_fuzz.py \
            --cases "$cases" \
            --seed "$seed" \
            --output "$GITHUB_WORKSPACE/fuzz-campaign.json"

      - name: Upload campaign report
        uses: actions/upload-artifact@v7
        with:
          name: continuous-fuzz-report
          path: fuzz-campaign.json
