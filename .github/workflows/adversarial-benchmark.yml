name: Adversarial Analysis Benchmark

"on":
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:
    inputs:
      differential_run_id:
        description: "Successful Differential Corpus By Pass run whose maturity artifact should be attached"
        required: false
        type: string
  workflow_run:
    workflows: ["Differential Corpus By Pass"]
    types: [completed]

jobs:
  benchmark:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fixture_shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential clang pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2.0"
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Build and install package wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Run benchmark
        run: |
          wheel_root=/tmp/r2morph-adversarial-wheel-check
          rm -rf "$wheel_root"
          mkdir -p "$wheel_root"
          cp -R scripts tests fixtures pyproject.toml "$wheel_root"/
          cd "$wheel_root"
          export PYTHONPATH="$wheel_root${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/adversarial_benchmark.py \
            --all \
            --dataset fixtures/dataset \
            --generated-corpus \
            --passes all \
            --require-applied \
            --require-tool-slots \
            --fixture-shard-index "${{ matrix.fixture_shard }}" \
            --fixture-shard-count 4 \
            --output "$GITHUB_WORKSPACE/adversarial-benchmark.json"

      - name: Validate adversarial campaign summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("adversarial-benchmark.json").read_text(encoding="utf-8"))
          expected_generated = sorted(
              f"{source}_{profile}"
              for source in ("generated_abi", "generated_branch", "generated_calls", "generated_extended", "generated_lookup", "generated_memory", "generated_pointers", "generated_recursive", "generated_stack_strings", "generated_string", "generated_xlat")
              for profile in ("gcc-o0", "gcc-o1", "gcc-o2", "gcc-o3", "gcc-os", "gcc-pie-o2", "gcc-static-o2", "gcc-stripped-o2", "clang-o0", "clang-o2", "clang-o3", "clang-pie-o2")
          )
          expected_generated += [
              "generated_cpp_gxx-o0", "generated_cpp_gxx-o2", "generated_cpp_clangxx-o0", "generated_cpp_clangxx-o2",
              "generated_cpp_exceptions_gxx-o0", "generated_cpp_exceptions_gxx-o2",
              "generated_cpp_exceptions_clangxx-o0", "generated_cpp_exceptions_clangxx-o2",
          ]
          expected_generated.sort()
          corpus_scope = report["corpus_scope"]
          if (
              corpus_scope["families"] != ["repository-fixtures", "generated-elf-x86-64", "generated-cpp-x86-64"]
              or corpus_scope["generated_fixture_count"] != len(expected_generated)
              or corpus_scope["generated_fixture_names"] != expected_generated
          ):
              raise SystemExit(f"unexpected generated corpus manifest: {corpus_scope}")
          summary = report["summary"]
          expected_tools = [
              "radare2",
              "objdump",
              "angr",
              "binary-ninja",
              "unicorn",
              "triton",
              "ida-pro",
              "ghidra",
              "custom",
          ]
          if summary["expected_tools"] != expected_tools:
              raise SystemExit(f"unexpected analyzer slots: {summary['expected_tools']}")
          if summary["observed_tools"] != sorted(expected_tools):
              raise SystemExit(f"missing observed analyzer slots: {summary['observed_tools']}")
          if summary["missing_pass_runs"] != 0:
              raise SystemExit(f"missing pass runs: {summary['missing_pass_runs_by_pass']}")
          if summary["missing_tool_runs"] != 0:
              raise SystemExit(f"missing tool runs: {summary['missing_tool_runs_by_tool']}")
          angr_completed = summary["completed_tool_runs_by_tool"].get("angr", 0)
          if angr_completed != summary["expected_pass_runs"]:
              raise SystemExit(
                  f"angr campaign is incomplete: {angr_completed}/{summary['expected_pass_runs']}"
              )
          if summary["unavailable_tool_runs_by_tool"].get("angr", 0):
              raise SystemExit("angr campaign reported unavailable runs")
          if summary["error_tool_runs_by_tool"].get("angr", 0):
              raise SystemExit("angr campaign reported error runs")
          effectiveness = summary["analyzer_effectiveness_by_pass"]
          expected_passes = set(report["pass_names"])
          if set(effectiveness) != expected_passes:
              raise SystemExit(
                  "analyzer effectiveness pass coverage drift: "
                  f"expected={sorted(expected_passes)} observed={sorted(effectiveness)}"
              )
          for pass_name, tools in effectiveness.items():
              if set(tools) != set(expected_tools):
                  raise SystemExit(
                      f"analyzer effectiveness tool coverage drift for {pass_name}: {sorted(tools)}"
                  )
              if any(row["runs"] != report["sample_count"] for row in tools.values()):
                  raise SystemExit(f"analyzer effectiveness run coverage drift for {pass_name}: {tools}")
              for decompiler_tool in ("radare2", "angr"):
                  decompiler = tools[decompiler_tool].get("decompiler")
                  if not isinstance(decompiler, dict):
                      raise SystemExit(f"{decompiler_tool} decompiler evidence is missing for {pass_name}")
                  if (
                      decompiler.get("observed_pairs") != report["sample_count"]
                      or decompiler.get("completed_pairs") != report["sample_count"]
                      or decompiler.get("completion_percent") != 100.0
                  ):
                      raise SystemExit(
                          f"{decompiler_tool} decompiler evidence is incomplete for {pass_name}: {decompiler}"
                      )
          incomplete_by_tool = {
              row["tool"]: row
              for row in summary["incomplete_tool_coverage"]
          }
          expected_incomplete = {
              tool
              for tool in expected_tools
              if summary["completed_tool_runs_by_tool"].get(tool, 0) != summary["expected_pass_runs"]
          }
          if set(incomplete_by_tool) != expected_incomplete:
              raise SystemExit(f"incomplete tool coverage drift: {incomplete_by_tool}")
          for tool, row in incomplete_by_tool.items():
              expected_row = {
                  "completed_runs": summary["completed_tool_runs_by_tool"].get(tool, 0),
                  "missing_runs": summary["missing_tool_runs_by_tool"].get(tool, 0),
                  "unavailable_runs": summary["unavailable_tool_runs_by_tool"].get(tool, 0),
                  "error_runs": summary["error_tool_runs_by_tool"].get(tool, 0),
              }
              observed_row = {key: row[key] for key in expected_row}
              if observed_row != expected_row:
                  raise SystemExit(f"incomplete tool coverage mismatch for {tool}: {row}")
          missing_applications = [
              name
              for name, values in report["pass_summary"].items()
              if values["applied"] == 0
          ]
          expected_blockers = {}
          if missing_applications:
              expected_blockers["passes_without_applied_runs"] = missing_applications
          for field in (
              "missing_passes",
              "missing_pass_runs_by_pass",
              "error_pass_runs_by_pass",
              "incomplete_tool_coverage",
              "non_completed_tool_runs_by_tool",
              "tools_without_full_completion",
              "unavailable_tool_runs_by_tool",
              "unavailable_reasons_by_tool",
          ):
              if summary[field]:
                  expected_blockers[field] = summary[field]
          if summary["adversarial_evidence_blockers"] != expected_blockers:
              raise SystemExit(
                  f"adversarial evidence blockers drift: {summary['adversarial_evidence_blockers']}"
              )
          blocker_totals = summary["adversarial_evidence_blocker_totals"]
          expected_total = sum(
              value
              for field, value in blocker_totals.items()
              if field not in {"blocker_categories", "total_adversarial_evidence_blockers"}
          )
          if blocker_totals["total_adversarial_evidence_blockers"] != expected_total:
              raise SystemExit(f"adversarial evidence blocker totals drift: {blocker_totals}")
          PY

      - name: Run VM resistance seed-diversity smoke
        if: always()
        run: |
          wheel_root=/tmp/r2morph-adversarial-wheel-check
          cp -R docs "$wheel_root"/
          cd "$wheel_root"
          export PYTHONPATH="$wheel_root${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/protection_handler_clustering.py \
            --first-seed 20260820 \
            --count 10 \
            --output "$GITHUB_WORKSPACE/vm-resistance-seed-diversity.json"
          python scripts/protection_bytecode_grammar.py \
            --first-seed 20260820 \
            --count 10 \
            --output "$GITHUB_WORKSPACE/vm-resistance-bytecode-grammar.json"
          python -W error -m pytest -q --no-cov --tb=short \
            tests/integration/test_protection_bytecode_grammar.py \
            tests/integration/test_protection_handler_clustering.py \
            tests/unit/test_resistance_measurement_contract.py

      - name: Validate VM resistance seed-diversity evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("vm-resistance-seed-diversity.json").read_text(encoding="utf-8"))
          grammar = json.loads(Path("vm-resistance-bytecode-grammar.json").read_text(encoding="utf-8"))
          if report["seed_count"] != 10:
              raise SystemExit(f"unexpected seed count: {report['seed_count']}")
          if report["adversarial_validation"]["status"] != "pending-human-adversarial-review":
              raise SystemExit(f"unexpected adversarial validation: {report['adversarial_validation']}")
          if report["cross_seed_has_exact_normalised_matches"]:
              raise SystemExit("handler clustering has exact cross-seed matches")
          if report["cross_seed_largest_normalised_cluster"] != 1:
              raise SystemExit(f"unexpected largest cluster: {report['cross_seed_largest_normalised_cluster']}")
          if report["cross_seed_nearest_similarity_mean"] >= report["similarity_threshold"]:
              raise SystemExit("mean handler similarity reached the configured threshold")
          if grammar["seed_count"] != 10 or grammar["seeds_without_target_handlers"] != 0:
              raise SystemExit(f"incomplete target-handler grammar coverage: {grammar}")
          if grammar["target_stride_unique_count"] < 2 or grammar["total_padding_bytes"] <= 0:
              raise SystemExit(f"bytecode grammar lacks per-instance variation: {grammar}")
          if grammar["adversarial_validation"]["status"] != "pending-human-adversarial-review":
              raise SystemExit(f"unexpected grammar validation status: {grammar['adversarial_validation']}")
          PY

      - name: Run VM tamper and progressive protection smoke
        if: always()
        run: |
          wheel_root=/tmp/r2morph-adversarial-wheel-check
          cd "$wheel_root"
          export PYTHONPATH="$wheel_root${PYTHONPATH:+:$PYTHONPATH}"
          python scripts/vm_resistance_adversarial.py \
            --fixture fixtures/dataset/elf_vm_shift_x86_64 \
            --fixture fixtures/dataset/elf_vm_bigimm_x86_64 \
            --fixture fixtures/dataset/elf_vm_call_x86_64 \
            --fixture fixtures/dataset/elf_vm_memwidth_x86_64 \
            --fixture fixtures/dataset/elf_vm_simdint_x86_64 \
            --generated-corpus \
            --first-seed 20260820 \
            --count 10 \
            --output "$GITHUB_WORKSPACE/vm-resistance-adversarial.json"
          python -W error -m pytest -q --no-cov --tb=short \
            --junitxml="$GITHUB_WORKSPACE/vm-resistance-adversarial.xml" \
            tests/integration/test_code_virtualization_real.py::test_tampering_interpreter_byte_diverges_from_original \
            tests/integration/test_code_virtualization_real.py::test_tampering_nested_interpreter_byte_diverges \
            tests/integration/test_code_virtualization_real.py::test_nested_virtualization_grows_with_depth \
            tests/integration/test_code_virtualization_diversification_real.py \
            tests/integration/test_vm_resistance_adversarial.py

      - name: Validate VM tamper and progressive protection smoke
        if: always()
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("vm-resistance-adversarial.xml")
          if not report.exists():
              raise SystemExit("VM resistance smoke report is missing")
          suite = ET.parse(report).getroot()
          cases = suite.findall(".//testcase")
          if len(cases) != 10:
              raise SystemExit(f"unexpected VM resistance smoke case count: {len(cases)}")
          if suite.findall(".//failure") or suite.findall(".//error") or suite.findall(".//skipped"):
              raise SystemExit("VM resistance smoke contains failed or skipped cases")

          evidence = Path("vm-resistance-adversarial.json")
          if not evidence.exists():
              raise SystemExit("automated VM resistance evidence is missing")
          report = json.loads(evidence.read_text(encoding="utf-8"))
          if report["automated_validation"]["status"] != "completed":
              raise SystemExit("automated VM resistance validation did not complete")
          if report["seed_count"] != 10:
              raise SystemExit(f"unexpected VM resistance seed count: {report['seed_count']}")
          if report["fixture_count"] != 9:
              raise SystemExit(f"unexpected VM resistance fixture count: {report['fixture_count']}")
          if not report["semantic_parity"] or not report["cross_fixture_distinct_artifacts"]:
              raise SystemExit("VM fixture campaign lost semantic parity or artifact diversity")
          if not report["all_tamper_probes_diverged"]:
              raise SystemExit("VM tamper matrix did not diverge at every fixture and layer")
          if not report["progressive_growth_observed"]:
              raise SystemExit("progressive VM bytecode growth was not observed for every fixture")
          for field in (
              "dispatcher_diversity_observed",
              "opcode_assignment_diversity_observed",
              "handler_diversity_observed",
              "bytecode_grammar_diversity_observed",
          ):
              if not report[field]:
                  raise SystemExit(f"VM resistance diversity evidence is incomplete: {field}")
          for fixture in report["fixtures"]:
              if fixture["opcode_and_dispatcher_diversity"]["dispatcher_unique_count"] != fixture["seed_count"]:
                  raise SystemExit("VM dispatcher diversity did not vary across seeds")
              for layer in ("single_layer", "nested"):
                  if not fixture["anti_tamper"][layer]["tamper_diverged"]:
                      raise SystemExit(f"VM {layer} tamper_diverged probe did not diverge")
                  if fixture["anti_tamper"][layer]["native_original"]["status"] != "completed":
                      raise SystemExit(f"VM {layer} native tamper baseline did not execute")
                  if not fixture["anti_tamper"][layer]["all_native_tamper_probes_diverged"]:
                      raise SystemExit(f"VM {layer} native tamper probes did not diverge")
                  if fixture["anti_tamper"][layer]["adversarial_recovery"]["status"] != "completed":
                      raise SystemExit(f"VM {layer} bounded adversarial recovery probe did not complete")
          if not report["adversarial_recovery_probe_observed"]:
              raise SystemExit("bounded adversarial recovery evidence is incomplete")
          if report["human_adversarial_review"]["status"] != "pending-human-adversarial-review":
              raise SystemExit("automated evidence must not imply human adversarial signoff")
          PY

      - name: Upload VM tamper and progressive protection smoke
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-resistance-adversarial-${{ matrix.fixture_shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vm-resistance-adversarial.xml
            vm-resistance-adversarial.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: adversarial-benchmark-${{ matrix.fixture_shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: adversarial-benchmark.json

      - name: Upload VM resistance seed-diversity evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-resistance-seed-diversity-${{ matrix.fixture_shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: vm-resistance-seed-diversity.json

      - name: Upload VM resistance bytecode grammar evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vm-resistance-bytecode-grammar-${{ matrix.fixture_shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: vm-resistance-bytecode-grammar.json

  aggregate-benchmark:
    name: Aggregate adversarial benchmark evidence
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: adversarial-benchmark-*
          path: adversarial-reports
          merge-multiple: false

      - name: Download upstream maturity evidence
        if: ${{ github.event_name == 'workflow_run' || inputs.differential_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.differential_run_id }}
          pattern: differential-corpus-merged-*
          path: upstream-maturity
          merge-multiple: false

      - name: Merge and validate benchmark evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts.adversarial_benchmark import merge_adversarial_reports
          from scripts.protection_maturity_baseline import CORPUS_PASS_NAMES, discover_executables

          paths = sorted(Path("adversarial-reports").glob("*/adversarial-benchmark.json"))
          if len(paths) != 4:
              raise SystemExit(f"expected 4 adversarial shard reports, found {len(paths)}")
          report = merge_adversarial_reports(
              [json.loads(path.read_text(encoding="utf-8")) for path in paths]
          )
          corpus_scope = report.get("corpus_scope")
          expected_generated = sorted(
              f"{source}_{profile}"
              for source in ("generated_abi", "generated_branch", "generated_calls", "generated_extended", "generated_lookup", "generated_memory", "generated_pointers", "generated_recursive", "generated_stack_strings", "generated_string", "generated_xlat")
              for profile in ("gcc-o0", "gcc-o1", "gcc-o2", "gcc-o3", "gcc-os", "gcc-pie-o2", "gcc-static-o2", "gcc-stripped-o2", "clang-o0", "clang-o2", "clang-o3", "clang-pie-o2")
          )
          expected_generated += [
              "generated_cpp_gxx-o0", "generated_cpp_gxx-o2", "generated_cpp_clangxx-o0", "generated_cpp_clangxx-o2",
              "generated_cpp_exceptions_gxx-o0", "generated_cpp_exceptions_gxx-o2",
              "generated_cpp_exceptions_clangxx-o0", "generated_cpp_exceptions_clangxx-o2",
          ]
          expected_generated.sort()
          if corpus_scope != {
              "families": ["repository-fixtures", "generated-elf-x86-64", "generated-cpp-x86-64"],
              "generated_fixture_count": len(expected_generated),
              "generated_fixture_names": expected_generated,
          }:
              raise SystemExit(f"unexpected adversarial corpus scope: {corpus_scope}")
          expected_fixtures = {path.name for path in discover_executables(Path("fixtures/dataset"))}
          expected_fixtures.update(expected_generated)
          observed_fixtures = {
              sample["original"]
              for sample in report["samples"]
              if isinstance(sample, dict) and isinstance(sample.get("original"), str)
          }
          if observed_fixtures != expected_fixtures:
              raise SystemExit(
                  "adversarial fixture manifest drift: "
                  f"missing={sorted(expected_fixtures - observed_fixtures)} "
                  f"unexpected={sorted(observed_fixtures - expected_fixtures)}"
              )
          summary = report["summary"]
          if summary["missing_pass_runs"] or summary["missing_tool_runs"]:
              raise SystemExit(
                  f"merged benchmark has missing rows: passes={summary['missing_pass_runs']} "
                  f"tools={summary['missing_tool_runs']}"
              )
          if summary["error_pass_runs"] or summary["error_tool_runs"]:
              raise SystemExit(
                  f"merged benchmark has errors: passes={summary['error_pass_runs']} "
                  f"tools={summary['error_tool_runs']}"
              )
          effectiveness = summary["analyzer_effectiveness_by_pass"]
          expected_tools = set(summary["expected_tools"])
          for pass_name, tools in effectiveness.items():
              if set(tools) != expected_tools:
                  raise SystemExit(
                      f"merged analyzer effectiveness tool coverage drift for {pass_name}: {sorted(tools)}"
                  )
              if any(row["runs"] != report["sample_count"] for row in tools.values()):
                  raise SystemExit(f"merged analyzer effectiveness run coverage drift for {pass_name}")
              for decompiler_tool in ("radare2", "angr"):
                  decompiler = tools[decompiler_tool].get("decompiler")
                  if not isinstance(decompiler, dict):
                      raise SystemExit(
                          f"merged {decompiler_tool} decompiler evidence is missing for {pass_name}"
                      )
                  if (
                      decompiler.get("observed_pairs") != report["sample_count"]
                      or decompiler.get("completed_pairs") != report["sample_count"]
                      or decompiler.get("completion_percent") != 100.0
                  ):
                      raise SystemExit(
                          f"merged {decompiler_tool} decompiler evidence is incomplete for {pass_name}: "
                          f"{decompiler}"
                      )
          missing_corpus_passes = [
              pass_name
              for pass_name in summary["adversarial_evidence_blockers"].get(
                  "passes_without_applied_runs", []
              )
              if pass_name in CORPUS_PASS_NAMES
          ]
          if missing_corpus_passes:
              raise SystemExit(
                  "corpus passes without applications after all shards: "
                  f"{missing_corpus_passes}"
              )
          Path("adversarial-benchmark-merged.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Attach decompiler evidence to maturity report
        if: ${{ github.event_name == 'workflow_run' || inputs.differential_run_id != '' }}
        run: |
          base_evidence=$(find upstream-maturity -name maturity-evidence-merged.json -print -quit)
          if [ -z "$base_evidence" ]; then
            echo "upstream maturity evidence is missing" >&2
            exit 1
          fi
          python scripts/maturity_evidence.py \
            --differential "$base_evidence" \
            --extended "$base_evidence" \
            --composition-dir . \
            --base-evidence "$base_evidence" \
            --adversarial adversarial-benchmark-merged.json \
            --output maturity-evidence-with-adversarial.json

      - name: Upload merged benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-benchmark-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            adversarial-benchmark-merged.json
            maturity-evidence-with-adversarial.json
