name: Adversarial Analysis Benchmark

"on":
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential pkg-config wget cmake binutils
          git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2.git /tmp/radare2
          cd /tmp/radare2
          sys/install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Run benchmark
        run: |
          python scripts/adversarial_benchmark.py \
            --all \
            --dataset fixtures/dataset \
            --passes all \
            --require-applied \
            --require-tool-slots \
            --output adversarial-benchmark.json

      - name: Validate adversarial campaign summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("adversarial-benchmark.json").read_text(encoding="utf-8"))
          summary = report["summary"]
          expected_tools = [
              "radare2",
              "objdump",
              "angr",
              "binary-ninja",
              "unicorn",
              "triton",
              "ida-pro",
              "ghidra",
              "custom",
          ]
          if summary["expected_tools"] != expected_tools:
              raise SystemExit(f"unexpected analyzer slots: {summary['expected_tools']}")
          if summary["observed_tools"] != sorted(expected_tools):
              raise SystemExit(f"missing observed analyzer slots: {summary['observed_tools']}")
          if summary["missing_pass_runs"] != 0:
              raise SystemExit(f"missing pass runs: {summary['missing_pass_runs_by_pass']}")
          if summary["missing_tool_runs"] != 0:
              raise SystemExit(f"missing tool runs: {summary['missing_tool_runs_by_tool']}")
          incomplete_by_tool = {
              row["tool"]: row
              for row in summary["incomplete_tool_coverage"]
          }
          expected_incomplete = {
              tool
              for tool in expected_tools
              if summary["completed_tool_runs_by_tool"].get(tool, 0) != summary["expected_pass_runs"]
          }
          if set(incomplete_by_tool) != expected_incomplete:
              raise SystemExit(f"incomplete tool coverage drift: {incomplete_by_tool}")
          for tool, row in incomplete_by_tool.items():
              expected_row = {
                  "completed_runs": summary["completed_tool_runs_by_tool"].get(tool, 0),
                  "missing_runs": summary["missing_tool_runs_by_tool"].get(tool, 0),
                  "unavailable_runs": summary["unavailable_tool_runs_by_tool"].get(tool, 0),
                  "error_runs": summary["error_tool_runs_by_tool"].get(tool, 0),
              }
              observed_row = {key: row[key] for key in expected_row}
              if observed_row != expected_row:
                  raise SystemExit(f"incomplete tool coverage mismatch for {tool}: {row}")
          missing_applications = [
              name
              for name, values in report["pass_summary"].items()
              if values["applied"] == 0
          ]
          if missing_applications:
              raise SystemExit(f"passes without applications: {missing_applications}")
          PY

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-benchmark
          path: adversarial-benchmark.json
