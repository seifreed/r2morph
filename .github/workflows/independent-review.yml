name: Independent Validation Review

"on":
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: ["Adversarial Analysis Benchmark"]
    types: [completed]

jobs:
  review:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --editable .

      - name: Download triggering adversarial campaign
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: adversarial-benchmark-merged-*
          path: campaign-evidence
          merge-multiple: false

      - name: Run independent review
        shell: bash
        run: |
          args=(--output independent-review.json)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            adversarial_report=$(find campaign-evidence -name adversarial-benchmark-merged.json -print -quit)
            test -n "$adversarial_report"
            args+=(--adversarial-report "$adversarial_report")
          fi
          python scripts/independent_review.py "${args[@]}"

      - name: Upload review report
        uses: actions/upload-artifact@v7
        with:
          name: independent-review
          path: independent-review.json
